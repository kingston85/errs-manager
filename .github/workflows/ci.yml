name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: errs_app
          POSTGRES_PASSWORD: errs_ci_pw
          POSTGRES_DB: errs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://errs_app:errs_ci_pw@localhost:5432/errs_db
      SESSION_SECRET: ci-only-secret-not-used-anywhere-real
      PORT: 3000
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run migrations (fresh baseline against a brand-new database)
        run: npm run migrate

      - name: Seed demo data
        run: npm run seed

      - name: Start the app
        run: nohup node src/server.js > server.log 2>&1 &

      - name: Wait for the app to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 1
          done
          echo "App never came up — server log:"
          cat server.log
          exit 1

      - name: Run the Playwright e2e suite
        run: node test-e2e.js

      - name: Server log (always, for debugging)
        if: always()
        run: cat server.log || true
