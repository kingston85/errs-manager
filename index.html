window.CMU_MACRO_TEXT = "' ====================================================================\n' ORIGINAL VBA / MACRO CODE from \"CMU_DATABASE Original.xlsx\" › Macro Setup\n' (kept for reference – the CMU Sheets web app replaces all of this code)\n' ====================================================================\n\nOption Explicit\nPublic CMU_User As String\nPublic CMU_Role As String\nPublic UI_HotBtn As Object\n#If VBA7 Then\nPrivate Declare PtrSafe Function UI_GetKeyState Lib \"user32\" Alias \"GetKeyState\" (ByVal nVirtKey As Long) As Integer\n#Else\nPrivate Declare Function UI_GetKeyState Lib \"user32\" Alias \"GetKeyState\" (ByVal nVirtKey As Long) As Integer\n#End If\nPrivate Const CMU_LOCKPWD As String = \"CMU#ERRS-2026\"\nPrivate Const CLR_FIRST As Long = 13\nPrivate Const CLR_LAST As Long = 32\nRem ==== ERRS CMU DATABASE 2026 - FORM ENGINE (paste into a standard Module) ====\n\nPrivate Function GetCfg(ByVal s As String, tbl As String, idCol As String, pre As String, mp As String, hasCo As Boolean) As Boolean\n    GetCfg = True: hasCo = True: idCol = \"Record ID\"\n    Select Case s\n        Case \"Company Form\"\n            tbl = \"tblCompanies\": idCol = \"Company ID\": pre = \"CMU-\": hasCo = False\n            mp = \"C6=Company Name|C7=Sector / Activity|C8=Location|C9=Other Names Recorded\"\n        Case \"Licence Form\"\n            tbl = \"tblLicences\": pre = \"LIC-\"\n            mp = \"C7=Licence Category|C8=Licence / Certificate Type|C9=Location|C10=Application Date|C11=Response Date|C12=Reference Code|C13=Licence / Certificate No.|C14=Date Issued|C15=Expiry Date|C16=Remarks\"\n        Case \"Clearance Form\"\n            tbl = \"tblClearances\": pre = \"CLR-\"\n            mp = \"C7=Chemical as Recorded|C8=Chemical (Standard)|C9=Qty as Recorded|C10=Unit|C11=B/L / Invoice / AWB No.|C12=Clearance Ref. No.|C13=Clearance Date|C14=Remarks\"\n        Case \"Bill Form\"\n            tbl = \"tblBills\": idCol = \"Bill ID\": pre = \"BIL-\"\n            mp = \"C7=Activity|C8=Location|C9=Purpose / Licence Billed|C10=Chemical|C11=Amount Billed (USD)|C12=Bill Date|C13=Bill Ref. No.|C14=Contact Person|C15=Contact Title\"\n        Case \"Payment Form\"\n            tbl = \"tblPayments\": pre = \"PAY-\"\n            mp = \"C7=Purpose / Services|C8=Amount (USD)|C9=Payment Date|C10=Receipt No.|C11=Remarks|C12=Bill No.\"\n        Case Else\n            GetCfg = False\n    End Select\nEnd Function\n\nPrivate Function GetLO(ByVal tbl As String) As ListObject\n    Dim ws As Worksheet, t As ListObject\n    For Each ws In ThisWorkbook.Worksheets\n        For Each t In ws.ListObjects\n            If t.Name = tbl Then Set GetLO = t: Exit Function\n        Next t\n    Next ws\nEnd Function\n\nPrivate Function ColIdx(lo As ListObject, ByVal nm As String) As Long\n    Dim c As ListColumn\n    For Each c In lo.ListColumns\n        If c.Name = nm Then ColIdx = c.Index: Exit Function\n    Next c\nEnd Function\n\nPrivate Function NextID(lo As ListObject, ByVal idCol As String, ByVal pre As String) As String\n    Dim c As Range, n As Long, mx As Long\n    If lo.ListRows.Count > 0 Then\n        For Each c In lo.ListColumns(idCol).DataBodyRange.Cells\n            If Left$(CStr(c.Value), Len(pre)) = pre Then\n                n = Val(Mid$(CStr(c.Value), Len(pre) + 1))\n                If n > mx Then mx = n\n            End If\n        Next c\n    End If\n    NextID = pre & Format(mx + 1, \"000\")\nEnd Function\n\nPrivate Function FindIdx(lo As ListObject, ByVal idCol As String, ByVal id As String) As Long\n    Dim r As Variant\n    If lo.ListRows.Count = 0 Or id = \"\" Then Exit Function\n    r = Application.Match(id, lo.ListColumns(idCol).DataBodyRange, 0)\n    If Not IsError(r) Then FindIdx = CLng(r)\nEnd Function\n\nPrivate Function CompanyID(ByVal nm As String) As String\n    Dim lo As ListObject, r As Variant\n    Set lo = GetLO(\"tblCompanies\")\n    r = Application.Match(nm, lo.ListColumns(\"Company Name\").DataBodyRange, 0)\n    If Not IsError(r) Then CompanyID = CStr(lo.ListColumns(\"Company ID\").DataBodyRange.Cells(r, 1).Value)\nEnd Function\n\nPrivate Function FormOK(sh As Worksheet) As Boolean\n    If InStr(1, CStr(sh.Range(\"C4\").Value), \"Ready\", vbTextCompare) > 0 Then\n        FormOK = True\n    Else\n        MsgBox \"The form is not complete:\" & vbCrLf & vbCrLf & Replace(CStr(sh.Range(\"C4\").Value), ChrW(10006), \"\"), vbExclamation, \"CMU Database\"\n    End If\nEnd Function\n\nPrivate Function WarningsOK(sh As Worksheet) As Boolean\n    Dim c As Range, msg As String\n    For Each c In sh.Range(\"D6:D20\").Cells\n        If InStr(1, CStr(c.Text), ChrW(9888)) > 0 Then msg = msg & \"- \" & sh.Cells(c.Row, 2).Value & \": \" & Replace(c.Text, ChrW(9888), \"\") & vbCrLf\n    Next c\n    If msg = \"\" Then\n        WarningsOK = True\n    Else\n        WarningsOK = (MsgBox(\"Please check:\" & vbCrLf & vbCrLf & msg & vbCrLf & \"Save anyway?\", vbYesNo + vbQuestion, \"CMU Database\") = vbYes)\n    End If\nEnd Function\n\nPrivate Sub WriteRow(lo As ListObject, ByVal idx As Long, sh As Worksheet, ByVal mp As String, ByVal hasCo As Boolean, ByVal isNew As Boolean)\n    Dim p As Variant, kv() As String, cell As Range, first As Range, j As Long\n    For Each p In Split(mp, \"|\")\n        kv = Split(p, \"=\")\n        Set cell = lo.DataBodyRange.Cells(idx, ColIdx(lo, kv(1)))\n        If CStr(sh.Range(kv(0)).Value) = \"\" Then cell.ClearContents Else cell.Value = sh.Range(kv(0)).Value\n    Next p\n    If hasCo Then\n        lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Company ID\")).Value = CompanyID(sh.Range(\"C6\").Value)\n        If ColIdx(lo, \"Name as Recorded\") > 0 Then lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Name as Recorded\")).Value = sh.Range(\"C6\").Value\n    End If\n    If ColIdx(lo, \"Source\") > 0 Then\n        Set cell = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Source\"))\n        If isNew Then\n            cell.Value = \"Form entry \" & Format(Now, \"dd-mmm-yyyy hh:nn\") & \" (\" & Application.UserName & \")\"\n        Else\n            cell.Value = CStr(cell.Value) & \" | Updated \" & Format(Now, \"dd-mmm-yyyy hh:nn\")\n        End If\n    End If\n    If isNew And ColIdx(lo, \"Record Group\") > 0 Then lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Record Group\")).Value = \"Form entry\"\n    Rem copy calculated formulas (Company Name, Status, kg, totals) into the row where missing\n    If idx > 1 Then\n        For j = 1 To lo.ListColumns.Count\n            Set cell = lo.DataBodyRange.Cells(idx, j)\n            Set first = lo.DataBodyRange.Cells(1, j)\n            If Not cell.HasFormula And CStr(cell.Value) = \"\" And first.HasFormula Then\n                If InStr(first.Formula, \"!\") = 0 Then cell.Formula = first.Formula\n            End If\n        Next j\n    End If\nEnd Sub\n\nPrivate Sub ClearInputs(sh As Worksheet, ByVal mp As String)\n    Dim p As Variant\n    sh.Range(\"C5\").ClearContents: If sh.Name = \"Licence Form\" Then Lic_ClearChems sh\n    sh.Range(\"C6\").ClearContents\n    For Each p In Split(mp, \"|\")\n        sh.Range(Split(p, \"=\")(0)).ClearContents\n    Next p\n    sh.Range(\"C6\").Select\nEnd Sub\n\nPublic Sub Form_Save()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, tbl As String, idCol As String, pre As String, mp As String, hasCo As Boolean\n    Dim lo As ListObject, newID As String, idx As Long\n    Set sh = ActiveSheet\n    If sh.Name = \"Clearance Form\" Then Clr_Save: Exit Sub\n    If sh.Name = \"Bill Form\" Then Bil_Save: Exit Sub\n    If Not GetCfg(sh.Name, tbl, idCol, pre, mp, hasCo) Then Exit Sub\n    If CStr(sh.Range(\"C5\").Value) <> \"\" Then\n        MsgBox \"The ID box (C5) is filled in. Use Update Record to change an existing record, or clear the ID to save a new one.\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    If Not FormOK(sh) Then Exit Sub\n    If Not WarningsOK(sh) Then Exit Sub\n    Set lo = GetLO(tbl): If Not Lic_ChemsOK(sh) Then Exit Sub\n    newID = NextID(lo, idCol, pre)\n    Application.ScreenUpdating = False\n    idx = lo.ListRows.Add(AlwaysInsert:=True).Index\n    lo.DataBodyRange.Cells(idx, ColIdx(lo, idCol)).Value = newID\n    WriteRow lo, idx, sh, mp, hasCo, True: Lic_SaveChems sh, newID\n    ClearInputs sh, mp\n    Application.ScreenUpdating = True\n    MsgBox \"Saved as \" & newID & \" in \" & lo.Parent.Name & \".\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Form_Find()\n    Dim sh As Worksheet, tbl As String, idCol As String, pre As String, mp As String, hasCo As Boolean\n    Dim lo As ListObject, idx As Long, id As String, p As Variant, kv() As String, src As Range, linked As Boolean\n    Set sh = ActiveSheet\n    If sh.Name = \"Clearance Form\" Then Clr_Find: Exit Sub\n    If sh.Name = \"Bill Form\" Then Bil_Find: Exit Sub\n    If Not GetCfg(sh.Name, tbl, idCol, pre, mp, hasCo) Then Exit Sub\n    id = Trim$(CStr(sh.Range(\"C5\").Value))\n    If id = \"\" Then id = Trim$(InputBox(\"Enter the \" & idCol & \" to find (e.g. \" & pre & \"001):\", \"Find record\"))\n    If id = \"\" Then Exit Sub\n    id = UCase$(id)\n    Set lo = GetLO(tbl)\n    idx = FindIdx(lo, idCol, id)\n    If idx = 0 Then\n        MsgBox id & \" was not found in \" & lo.Parent.Name & \".\", vbExclamation, \"CMU Database\"\n        Exit Sub\n    End If\n    ClearInputs sh, mp\n    sh.Range(\"C5\").Value = id: If sh.Name = \"Licence Form\" Then Lic_LoadChems sh, id\n    For Each p In Split(mp, \"|\")\n        kv = Split(p, \"=\")\n        Set src = lo.DataBodyRange.Cells(idx, ColIdx(lo, kv(1)))\n        sh.Range(kv(0)).Value = src.Value\n        If src.HasFormula And InStr(src.Formula, \"!\") > 0 Then linked = True\n    Next p\n    If hasCo Then sh.Range(\"C6\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Company Name\")).Value\n    If linked Then\n        MsgBox \"Loaded \" & id & \". Some fields are linked to Sheet1/Sheet2. Updating will replace those links with the values on the form.\", vbInformation, \"CMU Database\"\n    Else\n        MsgBox \"Loaded \" & id & \". Edit the fields, then click Update Record.\", vbInformation, \"CMU Database\"\n    End If\nEnd Sub\n\nPublic Sub Form_Update()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, tbl As String, idCol As String, pre As String, mp As String, hasCo As Boolean\n    Dim lo As ListObject, idx As Long, id As String\n    Set sh = ActiveSheet\n    If sh.Name = \"Clearance Form\" Then Clr_Update: Exit Sub\n    If sh.Name = \"Bill Form\" Then Bil_Update: Exit Sub\n    If Not GetCfg(sh.Name, tbl, idCol, pre, mp, hasCo) Then Exit Sub\n    id = UCase$(Trim$(CStr(sh.Range(\"C5\").Value)))\n    If id = \"\" Then\n        MsgBox \"Type the ID in C5 and click Find Record first.\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    Set lo = GetLO(tbl)\n    idx = FindIdx(lo, idCol, id): If Not Lic_ChemsOK(sh) Then Exit Sub\n    If idx = 0 Then\n        MsgBox id & \" was not found.\", vbExclamation, \"CMU Database\"\n        Exit Sub\n    End If\n    If Not FormOK(sh) Then Exit Sub\n    If MsgBox(\"Update \" & id & \" with the values on this form?\", vbYesNo + vbQuestion, \"CMU Database\") <> vbYes Then Exit Sub\n    WriteRow lo, idx, sh, mp, hasCo, False: Lic_SaveChems sh, id\n    MsgBox id & \" updated.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Form_Delete()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, tbl As String, idCol As String, pre As String, mp As String, hasCo As Boolean\n    Dim lo As ListObject, idx As Long, id As String, n As Long, t As Variant\n    Set sh = ActiveSheet\n    If sh.Name = \"Clearance Form\" Then Clr_Delete: Exit Sub\n    If sh.Name = \"Bill Form\" Then Bil_Delete: Exit Sub\n    If Not GetCfg(sh.Name, tbl, idCol, pre, mp, hasCo) Then Exit Sub\n    id = UCase$(Trim$(CStr(sh.Range(\"C5\").Value)))\n    If id = \"\" Then id = UCase$(Trim$(InputBox(\"Enter the \" & idCol & \" to delete:\", \"Delete record\")))\n    If id = \"\" Then Exit Sub\n    Set lo = GetLO(tbl)\n    idx = FindIdx(lo, idCol, id)\n    If idx = 0 Then\n        MsgBox id & \" was not found.\", vbExclamation, \"CMU Database\"\n        Exit Sub\n    End If\n    If tbl = \"tblCompanies\" Then\n        For Each t In Array(\"tblLicences\", \"tblClearances\", \"tblBills\", \"tblPayments\", \"tblCorrespondence\")\n            n = n + Application.WorksheetFunction.CountIf(GetLO(CStr(t)).ListColumns(\"Company ID\").DataBodyRange, id)\n        Next t\n        If n > 0 Then\n            MsgBox \"Cannot delete \" & id & \": it is used by \" & n & \" licence/clearance/bill/payment record(s).\", vbCritical, \"CMU Database\"\n            Exit Sub\n        End If\n    End If\n    If MsgBox(\"Permanently delete \" & id & \" from \" & lo.Parent.Name & \"?\" & vbCrLf & \"This cannot be undone.\", vbYesNo + vbCritical, \"CMU Database\") <> vbYes Then Exit Sub\n    lo.ListRows(idx).Delete: If tbl = \"tblLicences\" Then Lic_DeleteChems id: Eff_Delete id\n    ClearInputs sh, mp\n    MsgBox id & \" deleted.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Form_Clear()\n    Dim sh As Worksheet, tbl As String, idCol As String, pre As String, mp As String, hasCo As Boolean\n    Set sh = ActiveSheet\n    If sh.Name = \"Clearance Form\" Then Clr_Clear: Exit Sub\n    If sh.Name = \"Bill Form\" Then Bil_Clear: Exit Sub\n    If GetCfg(sh.Name, tbl, idCol, pre, mp, hasCo) Then ClearInputs sh, mp\nEnd Sub\n\nPublic Sub Form_OpenRegister()\n    Dim sh As Worksheet, tbl As String, idCol As String, pre As String, mp As String, hasCo As Boolean, lo As ListObject\n    Set sh = ActiveSheet\n    If Not GetCfg(sh.Name, tbl, idCol, pre, mp, hasCo) Then Exit Sub\n    Set lo = GetLO(tbl)\n    lo.Parent.Activate\n    If lo.ListRows.Count > 0 Then lo.ListRows(lo.ListRows.Count).Range.Cells(1, 1).Select\nEnd Sub\n\nPublic Sub Form_PrintPage()\n    Dim sh As Worksheet, id As String, target As String, cat As String, c As Range, pick As String\n    Set sh = ActiveSheet\n    id = UCase$(Trim$(CStr(sh.Range(\"C5\").Value)))\n    Select Case sh.Name\n        Case \"Licence Form\"\n            cat = CStr(sh.Range(\"C7\").Value)\n            If InStr(1, cat, \"(CIL)\", vbTextCompare) > 0 Then\n                target = \"Print CIL\"\n            ElseIf InStr(1, cat, \"(CRL)\", vbTextCompare) > 0 Or cat = \"\" Then\n                target = \"Print CRL\"\n            ElseIf InStr(1, CStr(sh.Range(\"C8\").Value), \"Retention\", vbTextCompare) > 0 Then\n                target = \"Print EDL RP\"\n            ElseIf InStr(1, cat, \"(EDL)\", vbTextCompare) > 0 Or InStr(1, cat, \"Effluent\", vbTextCompare) > 0 Then\n                target = \"Print EDL\"\n            Else\n                MsgBox \"Print pages exist for Chemical Registration (CRL), Chemical Importation (CIL) and Effluent Discharge (EDL) licences only.\" & vbCrLf & \"This record is: \" & cat, vbInformation, \"CMU Database\"\n                Exit Sub\n            End If\n            pick = id\n        Case \"Clearance Form\"\n            target = \"Print Clearance\"\n            If id <> \"\" Then\n                For Each c In ThisWorkbook.Worksheets(\"Lists\").Range(\"R5:R404\").Cells\n                    If Left$(CStr(c.Value), Len(id) + 1) = id & \" \" Then pick = CStr(c.Value): Exit For\n                Next c\n                If pick = \"\" Then pick = id\n            End If\n        Case \"Bill Form\"\n            target = \"Print Bill\"\n            If id <> \"\" Then\n                For Each c In ThisWorkbook.Worksheets(\"Lists\").Range(\"Y5:Y404\").Cells\n                    If Left$(CStr(c.Value), Len(id) + 1) = id & \" \" Then pick = CStr(c.Value): Exit For\n                Next c\n            End If\n        Case Else\n            Exit Sub\n    End Select\n    With ThisWorkbook.Worksheets(target)\n        If pick <> \"\" Then\n            On Error Resume Next\n            .Range(\"J4\").Value = pick\n            On Error GoTo 0\n        End If\n        .Activate\n        .Range(\"J4\").Select\n    End With\n    If id = \"\" Then MsgBox \"No record loaded on the form, so the print page opened with its last selection.\" & vbCrLf & \"Tip: Find a record (or save it) first, then click this button to print that record.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Go_Menu()\n    ThisWorkbook.Worksheets(\"Main Menu\").Activate\n    ActiveSheet.Range(\"A1\").Select\nEnd Sub\n\nPublic Sub Nav_Go()\n    Dim target As String\n    On Error Resume Next\n    target = ActiveSheet.Shapes(Application.Caller).AlternativeText\n    On Error GoTo 0\n    If target = \"\" Then Exit Sub\n    If ThisWorkbook.Worksheets(target).Visible = xlSheetVisible Then ThisWorkbook.Worksheets(target).Activate Else MsgBox \"Your account does not have access to the \" & target & \" sheet.\", vbExclamation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Setup_Buttons()\n    Dim f As Variant, sh As Worksheet, s As Shape\n    For Each f In Array(\"Company Form\", \"Licence Form\", \"Clearance Form\", \"Bill Form\", \"Payment Form\")\n        Set sh = ThisWorkbook.Worksheets(f)\n        sh.Unprotect\n        For Each s In sh.Shapes\n            Select Case s.Name\n                Case \"btnSave\": s.OnAction = \"Form_Save\"\n                Case \"btnFind\": s.OnAction = \"Form_Find\"\n                Case \"btnUpdate\": s.OnAction = \"Form_Update\"\n                Case \"btnDelete\": s.OnAction = \"Form_Delete\"\n                Case \"btnClear\": s.OnAction = \"Form_Clear\"\n                Case \"btnRegister\": s.OnAction = \"Form_OpenRegister\"\n                Case \"btnPrintPage\": s.OnAction = \"Form_PrintPage\"\n                Case \"btnMakeBill\": s.OnAction = \"Bill_FromRecord\"\n                Case \"btnMenu\": s.OnAction = \"Go_Menu\"\n            End Select\n        Next s\n        sh.Protect DrawingObjects:=True, Contents:=True, UserInterfaceOnly:=True\n        sh.EnableSelection = xlUnlockedCells\n    Next f\n    For Each s In ThisWorkbook.Worksheets(\"Main Menu\").Shapes\n        If Left$(s.Name, 4) = \"nav_\" Then s.OnAction = \"Nav_Go\"\n        If s.Name = \"btnNewBill\" Then s.OnAction = \"Show_BillForm\"\n        If s.Name = \"nav_F1\" Then s.OnAction = \"Show_CompanyForm\"\n        If s.Name = \"nav_F5\" Then s.OnAction = \"Show_PayForm\"\n        If s.Name = \"btnFindAny\" Then s.OnAction = \"Show_FindForm\"\n        If s.Name = \"btnUsers\" Then s.OnAction = \"Show_UsersForm\"\n        If s.Name = \"btnMyPwd\" Then s.OnAction = \"Show_MyPwdForm\"\n        If s.Name = \"btnLogout\" Then s.OnAction = \"CMU_Logout\"\n    Next s\n    For Each s In ThisWorkbook.Worksheets(\"Login\").Shapes\n        If s.Name = \"btnSignIn\" Then s.OnAction = \"Show_LoginForm\"\n    Next s\n    Rem Main Menu button on every sheet\n    Dim w As Worksheet\n    For Each w In ThisWorkbook.Worksheets\n        If Not w.ProtectDrawingObjects Then\n            For Each s In w.Shapes\n                If s.Name = \"btnMenu\" Then s.OnAction = \"Go_Menu\"\n            Next s\n        End If\n    Next w\n    Setup_PrintButtons\n    MsgBox \"Buttons connected and forms protected. The database is ready to use.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nRem ==== MULTI-CHEMICAL CLEARANCE FORM (Clearance Form sheet) ====\nRem Clearance No. (CLN-###) is automatic and groups all chemical lines of one clearance.\n\nPrivate Sub Clr_Prot(sh As Worksheet)\n    On Error Resume Next\n    sh.Protect DrawingObjects:=True, Contents:=True, UserInterfaceOnly:=True\n    sh.EnableSelection = xlUnlockedCells\nEnd Sub\n\nPrivate Function Clr_Map(ByVal r As Long) As String\n    Clr_Map = \"C\" & r & \"=Chemical as Recorded|D\" & r & \"=Chemical (Standard)|E\" & r & \"=Qty as Recorded|F\" & r & \"=Unit|C5=Clearance No.|C7=Clearance Date|C8=Clearance Ref. No.|G\" & r & \"=B/L / Invoice / AWB No.|C10=Remarks|C11=ETA\"\nEnd Function\n\nPrivate Function Clr_Loaded(sh As Worksheet) As Long\n    Clr_Loaded = Application.WorksheetFunction.CountA(sh.Range(\"H\" & CLR_FIRST & \":H\" & CLR_LAST))\nEnd Function\n\nPrivate Sub Clr_ClearForm(sh As Worksheet)\n    Clr_Prot sh\n    sh.Range(\"C5:C11\").ClearContents\n    sh.Range(\"C\" & CLR_FIRST & \":G\" & CLR_LAST).ClearContents\n    sh.Range(\"H\" & CLR_FIRST & \":H\" & CLR_LAST).ClearContents\n    sh.Range(\"C6\").Select\nEnd Sub\n\nPrivate Sub Clr_FillNames(sh As Worksheet)\n    Dim r As Long\n    Clr_Prot sh\n    For r = CLR_FIRST To CLR_LAST\n        If Trim$(CStr(sh.Range(\"C\" & r).Value)) = \"\" And Trim$(CStr(sh.Range(\"D\" & r).Value)) <> \"\" Then sh.Range(\"C\" & r).Value = sh.Range(\"D\" & r).Value\n        If Trim$(CStr(sh.Range(\"C\" & r).Value)) <> \"\" And Trim$(CStr(sh.Range(\"G\" & r).Value)) = \"\" Then sh.Range(\"G\" & r).Value = sh.Range(\"C9\").Value\n    Next r\n    Application.Calculate\nEnd Sub\n\nPrivate Function Clr_HasLine(sh As Worksheet, ByVal r As Long) As Boolean\n    Clr_HasLine = (Trim$(CStr(sh.Range(\"C\" & r).Value)) <> \"\")\nEnd Function\n\nPrivate Function Clr_WarnOK(sh As Worksheet) As Boolean\n    Dim c As Range, msg As String\n    For Each c In sh.Range(\"D6:D10\").Cells\n        If InStr(1, CStr(c.Text), ChrW(9888)) > 0 Then msg = msg & \"- \" & sh.Cells(c.Row, 2).Value & \": \" & Replace(c.Text, ChrW(9888), \"\") & vbCrLf\n    Next c\n    If msg = \"\" Then\n        Clr_WarnOK = True\n    Else\n        Clr_WarnOK = (MsgBox(\"Please check:\" & vbCrLf & vbCrLf & msg & vbCrLf & \"Save anyway?\", vbYesNo + vbQuestion, \"CMU Database\") = vbYes)\n    End If\nEnd Function\n\nPublic Sub Clr_Save()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, lo As ListObject, r As Long, idx As Long, id As String, n As Long, firstID As String, cln As String\n    Set sh = ActiveSheet\n    If Clr_Loaded(sh) > 0 Or CStr(sh.Range(\"C5\").Value) <> \"\" Then\n        MsgBox \"A Clearance No. is already in C5. Click Update to save changes to that clearance, or Clear Form to start a new one.\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    Clr_FillNames sh\n    If Not FormOK(sh) Then Exit Sub\n    If Not Clr_WarnOK(sh) Then Exit Sub\n    Set lo = GetLO(\"tblClearances\")\n    cln = NextID(lo, \"Clearance No.\", \"CLN-\")\n    Application.ScreenUpdating = False\n    sh.Range(\"C5\").Value = cln\n    For r = CLR_FIRST To CLR_LAST\n        If Clr_HasLine(sh, r) Then\n            id = NextID(lo, \"Record ID\", \"CLR-\")\n            idx = lo.ListRows.Add(AlwaysInsert:=True).Index\n            lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Record ID\")).Value = id\n            WriteRow lo, idx, sh, Clr_Map(r), True, True\n            If firstID = \"\" Then firstID = id\n            n = n + 1\n        End If\n    Next r\n    Application.ScreenUpdating = True\n    MsgBox \"Clearance \" & cln & \" saved: \" & n & \" chemical line(s) (\" & firstID & \" to \" & id & \").\", vbInformation, \"CMU Database\"\n    Clr_ClearForm sh\nEnd Sub\n\nPrivate Function Clr_Collect(lo As ListObject, ByVal colName As String, ByVal key As String, hit() As Long) As Long\n    Dim i As Long, c As Long, n As Long\n    c = ColIdx(lo, colName)\n    For i = 1 To lo.ListRows.Count\n        If StrComp(Trim$(CStr(lo.DataBodyRange.Cells(i, c).Value)), key, vbTextCompare) = 0 Then n = n + 1: hit(n) = i\n    Next i\n    Clr_Collect = n\nEnd Function\n\nPublic Sub Clr_Find()\n    Dim sh As Worksheet, lo As ListObject, key As String, i As Long, r As Long, n As Long, total As Long\n    Dim hit() As Long, idx As Long, linked As Boolean, c As Range, cln As String\n    Set sh = ActiveSheet\n    key = Trim$(CStr(sh.Range(\"C5\").Value))\n    If key = \"\" Then key = Trim$(InputBox(\"Enter the Clearance No. (e.g. CLN-005), EPA Ref. No., or a record ID (e.g. CLR-001):\", \"Find clearance\"))\n    If key = \"\" Then Exit Sub\n    Set lo = GetLO(\"tblClearances\")\n    If lo.ListRows.Count = 0 Then Exit Sub\n    ReDim hit(1 To lo.ListRows.Count)\n    total = Clr_Collect(lo, \"Clearance No.\", key, hit)\n    If total = 0 Then total = Clr_Collect(lo, \"Clearance Ref. No.\", key, hit)\n    If total = 0 Then total = Clr_Collect(lo, \"Record ID\", key, hit)\n    If total = 0 Then\n        MsgBox key & \" was not found as a Clearance No., EPA Ref. No. or Record ID.\", vbExclamation, \"CMU Database\"\n        Exit Sub\n    End If\n    cln = CStr(lo.DataBodyRange.Cells(hit(1), ColIdx(lo, \"Clearance No.\")).Value)\n    If cln <> \"\" Then total = Clr_Collect(lo, \"Clearance No.\", cln, hit)\n    Clr_ClearForm sh\n    Application.ScreenUpdating = False\n    idx = hit(1)\n    sh.Range(\"C5\").Value = cln\n    sh.Range(\"C6\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Company Name\")).Value\n    sh.Range(\"C7\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Clearance Date\")).Value\n    sh.Range(\"C8\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Clearance Ref. No.\")).Value\n    sh.Range(\"C9\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"B/L / Invoice / AWB No.\")).Value\n    sh.Range(\"C10\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Remarks\")).Value\n    sh.Range(\"C11\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"ETA\")).Value\n    For i = 1 To total\n        If i > CLR_LAST - CLR_FIRST + 1 Then Exit For\n        idx = hit(i): r = CLR_FIRST + i - 1\n        sh.Range(\"C\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Chemical as Recorded\")).Value\n        sh.Range(\"D\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Chemical (Standard)\")).Value\n        sh.Range(\"E\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Qty as Recorded\")).Value\n        sh.Range(\"F\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Unit\")).Value\n        sh.Range(\"G\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"B/L / Invoice / AWB No.\")).Value\n        sh.Range(\"H\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Record ID\")).Value\n        For Each c In lo.DataBodyRange.Rows(idx).Cells\n            If c.HasFormula And InStr(c.Formula, \"!\") > 0 Then linked = True\n        Next c\n        n = n + 1\n    Next i\n    Application.ScreenUpdating = True\n    If total > n Then MsgBox \"This clearance has \" & total & \" lines; only the first \" & n & \" were loaded.\", vbExclamation, \"CMU Database\"\n    If linked Then\n        MsgBox \"Loaded \" & cln & \" (\" & n & \" line(s)). Some fields are linked to Sheet1/Sheet2; Update will replace those links with the form values.\", vbInformation, \"CMU Database\"\n    Else\n        MsgBox \"Loaded \" & cln & \" (\" & n & \" chemical line(s)). Edit, add or clear lines, then click Update.\", vbInformation, \"CMU Database\"\n    End If\nEnd Sub\n\nPublic Sub Clr_Update()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, lo As ListObject, r As Long, idx As Long, id As String\n    Dim nU As Long, nA As Long, nD As Long, delIDs As String, d As Variant\n    Set sh = ActiveSheet\n    If Clr_Loaded(sh) = 0 Or CStr(sh.Range(\"C5\").Value) = \"\" Then\n        MsgBox \"Type the Clearance No. in C5 and click Find Record first.\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    Clr_FillNames sh\n    If Not FormOK(sh) Then Exit Sub\n    For r = CLR_FIRST To CLR_LAST\n        If CStr(sh.Range(\"H\" & r).Value) <> \"\" And Not Clr_HasLine(sh, r) Then nD = nD + 1\n    Next r\n    If MsgBox(\"Update clearance \" & sh.Range(\"C5\").Value & \"?\" & IIf(nD > 0, vbCrLf & nD & \" cleared line(s) will be DELETED from the register.\", \"\"), vbYesNo + vbQuestion, \"CMU Database\") <> vbYes Then Exit Sub\n    Set lo = GetLO(\"tblClearances\")\n    Application.ScreenUpdating = False\n    nD = 0\n    For r = CLR_FIRST To CLR_LAST\n        id = CStr(sh.Range(\"H\" & r).Value)\n        If Clr_HasLine(sh, r) Then\n            If id <> \"\" Then\n                idx = FindIdx(lo, \"Record ID\", id)\n                If idx > 0 Then WriteRow lo, idx, sh, Clr_Map(r), True, False: nU = nU + 1\n            Else\n                id = NextID(lo, \"Record ID\", \"CLR-\")\n                idx = lo.ListRows.Add(AlwaysInsert:=True).Index\n                lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Record ID\")).Value = id\n                WriteRow lo, idx, sh, Clr_Map(r), True, True\n                sh.Range(\"H\" & r).Value = id\n                nA = nA + 1\n            End If\n        ElseIf id <> \"\" Then\n            delIDs = delIDs & id & \"|\"\n            sh.Range(\"C\" & r & \":G\" & r).ClearContents\n            sh.Range(\"H\" & r).ClearContents\n        End If\n    Next r\n    If delIDs <> \"\" Then\n        For Each d In Split(Left$(delIDs, Len(delIDs) - 1), \"|\")\n            idx = FindIdx(lo, \"Record ID\", CStr(d))\n            If idx > 0 Then lo.ListRows(idx).Delete: nD = nD + 1\n        Next d\n    End If\n    Application.ScreenUpdating = True\n    MsgBox \"Clearance \" & sh.Range(\"C5\").Value & \" updated: \" & nU & \" changed, \" & nA & \" added, \" & nD & \" deleted.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Clr_Delete()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, lo As ListObject, r As Long, idx As Long, n As Long\n    Set sh = ActiveSheet\n    If Clr_Loaded(sh) = 0 Then\n        MsgBox \"Find the clearance first (type the Clearance No. in C5 and click Find Record).\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    If MsgBox(\"Permanently delete clearance \" & sh.Range(\"C5\").Value & \" and its \" & Clr_Loaded(sh) & \" chemical line(s)?\" & vbCrLf & \"This cannot be undone.\", vbYesNo + vbCritical, \"CMU Database\") <> vbYes Then Exit Sub\n    Set lo = GetLO(\"tblClearances\")\n    For r = CLR_FIRST To CLR_LAST\n        If CStr(sh.Range(\"H\" & r).Value) <> \"\" Then\n            idx = FindIdx(lo, \"Record ID\", CStr(sh.Range(\"H\" & r).Value))\n            If idx > 0 Then lo.ListRows(idx).Delete: n = n + 1\n        End If\n    Next r\n    Clr_ClearForm sh\n    MsgBox n & \" line(s) deleted.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Clr_Clear()\n    Clr_ClearForm ActiveSheet\nEnd Sub\nRem ==== PRINT PAGES (Print CRL / Print CIL / Print Bill) ====\n\nPublic Function AmountInWords(ByVal amt As Double) As String\n    Dim d As Double, c As Long, s As String\n    d = Int(Round(amt, 2)): c = CLng(Round((Round(amt, 2) - d) * 100, 0))\n    If d = 0 Then s = \"ZERO\" Else s = Trim$(WordsGroup(d))\n    If c > 0 Then s = s & \" AND \" & Format(c, \"00\") & \"/100\"\n    AmountInWords = UCase$(s)\nEnd Function\n\nPrivate Function WordsGroup(ByVal n As Double) As String\n    Dim units As Variant, scl As Variant, i As Long, chunk As Long, s As String\n    scl = Array(\"\", \" THOUSAND\", \" MILLION\", \" BILLION\")\n    i = 0\n    Do While n > 0 And i <= 3\n        chunk = CLng(n - Int(n / 1000) * 1000)\n        If chunk > 0 Then s = Words999(chunk) & scl(i) & IIf(s = \"\", \"\", \" \" & s)\n        n = Int(n / 1000): i = i + 1\n    Loop\n    WordsGroup = s\nEnd Function\n\nPrivate Function Words999(ByVal n As Long) As String\n    Dim ones As Variant, tens As Variant, s As String\n    ones = Array(\"\", \"ONE\", \"TWO\", \"THREE\", \"FOUR\", \"FIVE\", \"SIX\", \"SEVEN\", \"EIGHT\", \"NINE\", \"TEN\", \"ELEVEN\", \"TWELVE\", \"THIRTEEN\", \"FOURTEEN\", \"FIFTEEN\", \"SIXTEEN\", \"SEVENTEEN\", \"EIGHTEEN\", \"NINETEEN\")\n    tens = Array(\"\", \"\", \"TWENTY\", \"THIRTY\", \"FORTY\", \"FIFTY\", \"SIXTY\", \"SEVENTY\", \"EIGHTY\", \"NINETY\")\n    If n >= 100 Then s = ones(n \\ 100) & \" HUNDRED\": n = n Mod 100: If n > 0 Then s = s & \" \"\n    If n >= 20 Then\n        s = s & tens(n \\ 10)\n        If n Mod 10 > 0 Then s = s & \"-\" & ones(n Mod 10)\n    ElseIf n > 0 Then\n        s = s & ones(n)\n    End If\n    Words999 = s\nEnd Function\n\nPrivate Function Prn_Table(sh As Worksheet, t0 As Long, t1 As Long) As Boolean\n    Select Case sh.Name\n        Case \"Print CRL\": t0 = 22: t1 = 81: Prn_Table = True\n        Case \"Print CIL\": t0 = 22: t1 = 61: Prn_Table = True\n        Case \"Print EDL\": t0 = 26: t1 = 46: Prn_Table = True\n        Case \"Print EDL RP\": t0 = 20: t1 = 146: Prn_Table = True\n        Case \"Print Clearance\": t0 = 18: t1 = 37: Prn_Table = True\n        Case \"Print Bill\": t0 = 23: t1 = 34: Prn_Table = True\n    End Select\nEnd Function\n\nPrivate Sub Prn_Rows(sh As Worksheet, ByVal hideEmpty As Boolean)\n    Dim t0 As Long, t1 As Long, r As Long\n    If Not Prn_Table(sh, t0, t1) Then Exit Sub\n    Application.ScreenUpdating = False\n    For r = t0 + 1 To t1\n        If hideEmpty Then\n            If sh.Name = \"Print Bill\" Then\n                sh.Rows(r).Hidden = (CStr(sh.Range(\"C\" & r).Value) = \"\" And CStr(sh.Range(\"M\" & r).Value) <> \"T\" And CStr(sh.Range(\"B\" & r).Value) = \"\")\n            Else\n                sh.Rows(r).Hidden = IIf(sh.Name = \"Print EDL RP\", CStr(sh.Range(\"L\" & r).Value) = \"H\", CStr(sh.Range(IIf(sh.Name = \"Print Clearance\", \"B\", \"C\") & r).Value) = \"\")\n            End If\n            If sh.Name = \"Print Clearance\" And Not sh.Rows(r).Hidden Then sh.Rows(r).AutoFit\n        Else\n            sh.Rows(r).Hidden = False\n        End If\n    Next r\n    Application.ScreenUpdating = True\nEnd Sub\n\nPrivate Sub Prn_Logos(sh As Worksheet, ByVal printing As Boolean)\n    Dim s As Shape, show As Boolean\n    show = True\n    If printing And sh.Name = \"Print Bill\" Then show = (CStr(sh.Range(\"J8\").Value) = \"Yes\")\n    If printing And sh.Name = \"Print Clearance\" Then show = (CStr(sh.Range(\"J7\").Value) = \"Yes\"): If printing And (sh.Name = \"Print CRL\" Or sh.Name = \"Print CIL\" Or sh.Name = \"Print EDL\" Or sh.Name = \"Print EDL RP\") Then show = (CStr(sh.Range(\"J3\").Value) <> \"No\")\n    For Each s In sh.Shapes\n        If Left$(s.Name, 4) = \"logo\" Then s.Visible = IIf(show, msoTrue, msoFalse)\n    Next s\nEnd Sub\n\nPrivate Sub BoldPhrase(ByVal c As Range, ByVal ph As String)\n    Dim p As Long\n    If c.HasFormula Or ph = \"\" Then Exit Sub\n    p = InStr(1, CStr(c.Value), ph, vbTextCompare)\n    If p > 0 Then c.Characters(p, Len(ph)).Font.Bold = True\nEnd Sub\n\nPrivate Sub BoldInRange(ByVal rng As Range, ByVal phrases As String)\n    Dim c As Range, ph As Variant\n    For Each c In rng.Cells\n        If Not c.HasFormula And CStr(c.Value) <> \"\" Then\n            For Each ph In Split(phrases, \"|\")\n                BoldPhrase c, CStr(ph)\n            Next ph\n        End If\n    Next c\nEnd Sub\n\nRem Bold wording as in the original Word documents\nPrivate Sub Prn_Bold(sh As Worksheet, ByVal printing As Boolean)\n    Static billF As String\n    Static clrF As String\n    Dim c As Range, t As String, p As Long, q As Long\n    Select Case sh.Name\n        Case \"Print CRL\"\n            BoldInRange sh.Range(\"B8:F20\"), \"Chemical Registration License|Industrial Chemicals,\"\n            BoldInRange sh.Range(\"C82:F92\"), \"does not|violation|declared and registered\"\n        Case \"Print CIL\"\n            BoldInRange sh.Range(\"B8:F20\"), \"Chemical Importation License\"\n            BoldInRange sh.Range(\"C62:F78\"), \"not exceed|written notification|complies|Notify the Agency within 24 hours|Notify|Undertake adequate safety and security measures|chemicals specified|authorized custom entry points|expires immediately|Any violation|penalty\"\n        Case \"Print Clearance\"\n            Set c = sh.Range(\"B15\")\n            If printing Then\n                clrF = c.Formula\n                t = CStr(c.Value)\n                c.Value = t\n                c.Font.Bold = False\n                p = Len(\"This is to testify that \") + 1\n                q = InStr(p, t, \" is in the process\")\n                If q > p Then c.Characters(p, q - p).Font.Bold = True\n            ElseIf clrF <> \"\" Then\n                c.Formula = clrF\n                c.Font.Bold = False\n                clrF = \"\"\n            End If\n        Case \"Print Bill\"\n            Set c = sh.Range(\"B21\")\n            If printing Then\n                billF = c.Formula\n                t = CStr(c.Value)\n                c.Value = t\n                c.Font.Bold = False\n                p = InStr(1, t, \"UNITED STATES DOLLARS-\")\n                q = InStr(p + 1, t, \")\")\n                If p > 0 And q > p Then c.Characters(p, q - p + 1).Font.Bold = True\n                p = InStr(1, t, \"payable at the \")\n                If p > 0 Then c.Characters(p + 15, Len(t) - p - 14).Font.Bold = True\n            ElseIf billF <> \"\" Then\n                c.Formula = billF\n                c.Font.Bold = False\n                billF = \"\"\n            End If\n    End Select\nEnd Sub\n\nRem resize wrapped paragraph rows on the bill letter (merged cells do not auto-fit)\nPrivate Sub Prn_FitRows(sh As Worksheet)\n    Dim r As Variant, t As String, p As Variant, n As Long\n    If sh.Name <> \"Print Bill\" Then Exit Sub\n    For Each r In Array(19, 21, 36, 38)\n        t = CStr(sh.Range(\"B\" & r).Value)\n        n = 0\n        For Each p In Split(t, vbLf)\n            n = n + Application.WorksheetFunction.Max(1, -Int(-Len(CStr(p)) / 88))\n        Next p\n        If t = \"\" Then n = 1\n        sh.Rows(r).RowHeight = n * 15.5 + 3\n    Next r\nEnd Sub\n\nPrivate Function Prn_OK(sh As Worksheet) As Boolean\n    Dim msg As String\n    msg = CStr(sh.Range(\"J5\").Value)\n    If InStr(1, msg, ChrW(9888)) > 0 Then\n        Prn_OK = (MsgBox(\"Check before printing:\" & vbCrLf & vbCrLf & Replace(msg, ChrW(9888), \"\") & vbCrLf & vbCrLf & \"Continue anyway?\", vbYesNo + vbQuestion, \"CMU Database\") = vbYes)\n    Else\n        Prn_OK = True\n    End If\nEnd Function\n\nPublic Sub Print_Preview()\n    Dim sh As Worksheet\n    Set sh = ActiveSheet\n    If Not Prn_OK(sh) Then Exit Sub\n    Prn_Rows sh, True: Prn_Logos sh, True: Prn_Bold sh, True: Prn_FitRows sh\n    sh.PrintPreview\n    Prn_Rows sh, False: Prn_Logos sh, False: Prn_Bold sh, False\nEnd Sub\n\nPublic Sub Print_Now()\n    Dim sh As Worksheet\n    Set sh = ActiveSheet\n    If Not Prn_OK(sh) Then Exit Sub\n    If MsgBox(\"Send this document to the printer?\", vbYesNo + vbQuestion, \"CMU Database\") <> vbYes Then Exit Sub\n    Prn_Rows sh, True: Prn_Logos sh, True: Prn_Bold sh, True: Prn_FitRows sh\n    sh.PrintOut Copies:=1\n    Prn_Rows sh, False: Prn_Logos sh, False: Prn_Bold sh, False\nEnd Sub\n\nPublic Sub Print_PDF()\n    Dim sh As Worksheet, nm As String, f As String, ch As Variant\n    Set sh = ActiveSheet\n    If Not Prn_OK(sh) Then Exit Sub\n    If sh.Name = \"Print Bill\" Then\n        nm = \"Bill \" & sh.Range(\"K4\").Value & \" \" & sh.Range(\"J12\").Value\n    ElseIf sh.Name = \"Print Clearance\" Then\n        nm = \"Clearance \" & sh.Range(\"K4\").Value & \" \" & sh.Range(\"J8\").Value\n    Else\n        nm = sh.Name & \" \" & sh.Range(\"J7\").Value & \" \" & sh.Range(\"J8\").Value\n    End If\n    For Each ch In Array(\"/\", \"\\\", \":\", \"*\", \"?\", \"\"\"\", \"<\", \">\", \"|\")\n        nm = Replace(nm, ch, \"-\")\n    Next ch\n    f = ThisWorkbook.Path & Application.PathSeparator & Trim$(nm) & \".pdf\"\n    Prn_Rows sh, True: Prn_Logos sh, True: Prn_Bold sh, True: Prn_FitRows sh\n    sh.ExportAsFixedFormat Type:=xlTypePDF, Filename:=f, Quality:=xlQualityStandard, IgnorePrintAreas:=False, OpenAfterPublish:=True\n    Prn_Rows sh, False: Prn_Logos sh, False: Prn_Bold sh, False\n    MsgBox \"Saved: \" & f, vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Setup_PrintButtons()\n    Dim f As Variant, s As Shape\n    For Each f In Array(\"Print CRL\", \"Print CIL\", \"Print Bill\", \"Print Clearance\", \"Print EDL\", \"Print EDL RP\")\n        For Each s In ThisWorkbook.Worksheets(f).Shapes\n            On Error Resume Next\n            If Left$(s.Name, 3) = \"btn\" Or Left$(s.Name, 4) = \"hdr_\" Then s.DrawingObject.PrintObject = False\n            On Error GoTo 0\n            Select Case s.Name\n                Case \"btnPrintPreview\": s.OnAction = \"Print_Preview\"\n                Case \"btnPrint\": s.OnAction = \"Print_Now\"\n                Case \"btnPDF\": s.OnAction = \"Print_PDF\"\n                Case \"btnWord\": s.OnAction = \"Print_Word\"\n                Case \"btnMakeBill\": s.OnAction = \"Bill_FromRecord\"\n                Case \"btnMenu\": s.OnAction = \"Go_Menu\"\n            End Select\n        Next s\n    Next f\nEnd Sub\n\nRem ==== MULTI-SERVICE BILL FORM (Bill Form sheet) ====\nPrivate Function Bil_Map(ByVal r As Long) As String\n    Bil_Map = \"C\" & r & \"=Purpose / Licence Billed|D\" & r & \"=Chemical|E\" & r & \"=Amount Billed (USD)|C5=Bill No.|C7=Bill Date|C8=Bill Type|C9=Bill Ref. No.|C10=Contact Person|C11=Contact Title|C12=Location|C13=Activity|C14=Linked Record\"\nEnd Function\n\nPrivate Function Bil_Loaded(sh As Worksheet) As Long\n    Bil_Loaded = Application.WorksheetFunction.CountA(sh.Range(\"G17:G26\"))\nEnd Function\n\nPrivate Sub Bil_ClearForm(sh As Worksheet)\n    Clr_Prot sh\n    sh.Range(\"C5:C14\").ClearContents\n    sh.Range(\"C17:E26\").ClearContents\n    sh.Range(\"G17:G26\").ClearContents\n    If ActiveSheet.Name = sh.Name Then sh.Range(\"C6\").Select\nEnd Sub\n\nPrivate Function Bil_WarnOK(sh As Worksheet) As Boolean\n    Dim c As Range, msg As String\n    For Each c In sh.Range(\"D6:D13\").Cells\n        If InStr(1, CStr(c.Text), ChrW(9888)) > 0 Then msg = msg & \"- \" & sh.Cells(c.Row, 2).Value & \": \" & Replace(c.Text, ChrW(9888), \"\") & vbCrLf\n    Next c\n    If msg = \"\" Then\n        Bil_WarnOK = True\n    Else\n        Bil_WarnOK = (MsgBox(\"Please check:\" & vbCrLf & vbCrLf & msg & vbCrLf & \"Save anyway?\", vbYesNo + vbQuestion, \"CMU Database\") = vbYes)\n    End If\nEnd Function\n\nPrivate Sub Bil_Defaults(sh As Worksheet)\n    Dim lo As ListObject, r As Variant\n    Clr_Prot sh\n    If CStr(sh.Range(\"C8\").Value) = \"\" And CStr(sh.Range(\"C17\").Value) <> \"\" Then sh.Range(\"C8\").Value = Type_For(CStr(sh.Range(\"C17\").Value))\n    If CStr(sh.Range(\"C12\").Value) = \"\" And CStr(sh.Range(\"C6\").Value) <> \"\" Then\n        Set lo = GetLO(\"tblCompanies\")\n        r = Application.Match(sh.Range(\"C6\").Value, lo.ListColumns(\"Company Name\").DataBodyRange, 0)\n        If Not IsError(r) Then sh.Range(\"C12\").Value = lo.ListColumns(\"Location\").DataBodyRange.Cells(r, 1).Value\n    End If\n    Application.Calculate\nEnd Sub\n\nRem Bill Type used when a service is billed without a chosen type\nPublic Function Type_For(ByVal svc As String) As String\n    Dim ls As ListObject, r As Variant, g As String\n    Set ls = GetLO(\"tblServices\")\n    r = Application.Match(svc, ls.ListColumns(\"Service\").DataBodyRange, 0)\n    If Not IsError(r) Then g = CStr(ls.ListColumns(\"Bill Group\").DataBodyRange.Cells(r, 1).Value)\n    Select Case g\n        Case \"Licence\": Type_For = \"Licence – New Application\"\n        Case \"Clearance\": Type_For = \"Chemical Clearance\"\n        Case \"Fumigation\": Type_For = \"Fumigation\"\n        Case \"Transportation\": Type_For = \"Chemical Transportation\"\n        Case Else: Type_For = \"Penalty / Other\"\n    End Select\nEnd Function\n\nPrivate Function Group_OfType(ByVal bt As String) As String\n    Dim lt As ListObject, r As Variant\n    Set lt = GetLO(\"tblBillTypes\")\n    r = Application.Match(bt, lt.ListColumns(\"Bill Type\").DataBodyRange, 0)\n    If Not IsError(r) Then Group_OfType = CStr(lt.ListColumns(\"Bill Group\").DataBodyRange.Cells(r, 1).Value)\nEnd Function\n\nPublic Function CMU_CodeVersion() As String\n    CMU_CodeVersion = \"2026.09.26-R\"\nEnd Function\n\nPublic Sub Bil_Save()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, lo As ListObject, r As Long, idx As Long, id As String, n As Long, bn As String\n    Set sh = ActiveSheet\n    If Bil_Loaded(sh) > 0 Or CStr(sh.Range(\"C5\").Value) <> \"\" Then\n        MsgBox \"A Bill No. is already in C5. Click Update to save changes to that bill, or Clear Form to start a new one.\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    If Not FormOK(sh) Then Exit Sub\n    If CStr(sh.Range(\"C9\").Value) <> \"\" Then\n        If Application.WorksheetFunction.CountIf(GetLO(\"tblBills\").ListColumns(\"Bill Ref. No.\").DataBodyRange, sh.Range(\"C9\").Value) > 0 Then\n            MsgBox \"Bill Ref. No. \" & sh.Range(\"C9\").Value & \" is already used on another bill. Each bill needs its own reference number.\", vbCritical, \"CMU Database\"\n            Exit Sub\n        End If\n    End If\n    If Not Bil_WarnOK(sh) Then Exit Sub\n    Bil_Defaults sh\n    Set lo = GetLO(\"tblBills\")\n    bn = NextID(lo, \"Bill No.\", \"BN-\" & Year(Date) & \"-\")\n    Application.ScreenUpdating = False\n    sh.Range(\"C5\").Value = bn\n    For r = 17 To 26\n        If Trim$(CStr(sh.Range(\"C\" & r).Value)) <> \"\" Then\n            id = NextID(lo, \"Bill ID\", \"BIL-\")\n            idx = lo.ListRows.Add(AlwaysInsert:=True).Index\n            lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Bill ID\")).Value = id\n            WriteRow lo, idx, sh, Bil_Map(r), True, True\n            n = n + 1\n        End If\n    Next r\n    Application.ScreenUpdating = True\n    If MsgBox(\"Bill \" & bn & \" saved: \" & n & \" service line(s), total US$\" & Format(Application.Sum(sh.Range(\"E17:E26\")), \"#,##0.00\") & \".\" & vbCrLf & vbCrLf & \"Open the bill letter now?\", vbYesNo + vbInformation, \"CMU Database\") = vbYes Then\n        Form_PrintPage\n    End If\n    Bil_ClearForm sh\nEnd Sub\n\nPublic Sub Bil_Find()\n    Dim sh As Worksheet, lo As ListObject, key As String, i As Long, r As Long, n As Long, total As Long\n    Dim hit() As Long, idx As Long, bn As String\n    Set sh = ActiveSheet\n    key = Trim$(CStr(sh.Range(\"C5\").Value))\n    If key = \"\" Then key = Trim$(InputBox(\"Enter the Bill No. (e.g. BN-005), Bill Ref. No., or a line ID (e.g. BIL-001):\", \"Find bill\"))\n    If key = \"\" Then Exit Sub\n    Set lo = GetLO(\"tblBills\")\n    If lo.ListRows.Count = 0 Then Exit Sub\n    ReDim hit(1 To lo.ListRows.Count)\n    total = Clr_Collect(lo, \"Bill No.\", key, hit)\n    If total = 0 Then total = Clr_Collect(lo, \"Bill Ref. No.\", key, hit)\n    If total = 0 Then total = Clr_Collect(lo, \"Bill ID\", key, hit)\n    If total = 0 Then\n        MsgBox key & \" was not found as a Bill No., Bill Ref. No. or line ID.\", vbExclamation, \"CMU Database\"\n        Exit Sub\n    End If\n    bn = CStr(lo.DataBodyRange.Cells(hit(1), ColIdx(lo, \"Bill No.\")).Value)\n    If bn <> \"\" Then total = Clr_Collect(lo, \"Bill No.\", bn, hit)\n    Bil_ClearForm sh\n    Application.ScreenUpdating = False\n    idx = hit(1)\n    sh.Range(\"C5\").Value = bn\n    sh.Range(\"C6\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Company Name\")).Value\n    sh.Range(\"C7\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Bill Date\")).Value\n    sh.Range(\"C8\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Bill Type\")).Value\n    sh.Range(\"C9\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Bill Ref. No.\")).Value\n    sh.Range(\"C10\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Contact Person\")).Value\n    sh.Range(\"C11\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Contact Title\")).Value\n    sh.Range(\"C12\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Location\")).Value\n    sh.Range(\"C13\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Activity\")).Value\n    sh.Range(\"C14\").Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Linked Record\")).Value\n    For i = 1 To total\n        If i > 10 Then Exit For\n        idx = hit(i): r = 16 + i\n        sh.Range(\"C\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Purpose / Licence Billed\")).Value\n        sh.Range(\"D\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Chemical\")).Value\n        sh.Range(\"E\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Amount Billed (USD)\")).Value\n        sh.Range(\"G\" & r).Value = lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Bill ID\")).Value\n        n = n + 1\n    Next i\n    Application.ScreenUpdating = True\n    If total > n Then MsgBox \"This bill has \" & total & \" lines; only the first 10 were loaded.\", vbExclamation, \"CMU Database\"\n    MsgBox \"Loaded \" & bn & \" (\" & n & \" service line(s)). Edit, add or clear lines, then click Update.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Bil_Update()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, lo As ListObject, r As Long, idx As Long, id As String\n    Dim nU As Long, nA As Long, nD As Long, delIDs As String, d As Variant\n    Set sh = ActiveSheet\n    If Bil_Loaded(sh) = 0 Or CStr(sh.Range(\"C5\").Value) = \"\" Then\n        MsgBox \"Type the Bill No. in C5 and click Find Record first.\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    If Not FormOK(sh) Then Exit Sub\n    For r = 17 To 26\n        If CStr(sh.Range(\"G\" & r).Value) <> \"\" And Trim$(CStr(sh.Range(\"C\" & r).Value)) = \"\" Then nD = nD + 1\n    Next r\n    If MsgBox(\"Update bill \" & sh.Range(\"C5\").Value & \"?\" & IIf(nD > 0, vbCrLf & nD & \" cleared line(s) will be DELETED.\", \"\"), vbYesNo + vbQuestion, \"CMU Database\") <> vbYes Then Exit Sub\n    Bil_Defaults sh\n    Set lo = GetLO(\"tblBills\")\n    Application.ScreenUpdating = False\n    nD = 0\n    For r = 17 To 26\n        id = CStr(sh.Range(\"G\" & r).Value)\n        If Trim$(CStr(sh.Range(\"C\" & r).Value)) <> \"\" Then\n            If id <> \"\" Then\n                idx = FindIdx(lo, \"Bill ID\", id)\n                If idx > 0 Then WriteRow lo, idx, sh, Bil_Map(r), True, False: nU = nU + 1\n            Else\n                id = NextID(lo, \"Bill ID\", \"BIL-\")\n                idx = lo.ListRows.Add(AlwaysInsert:=True).Index\n                lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Bill ID\")).Value = id\n                WriteRow lo, idx, sh, Bil_Map(r), True, True\n                sh.Range(\"G\" & r).Value = id\n                nA = nA + 1\n            End If\n        ElseIf id <> \"\" Then\n            delIDs = delIDs & id & \"|\"\n            sh.Range(\"C\" & r & \":E\" & r).ClearContents\n            sh.Range(\"G\" & r).ClearContents\n        End If\n    Next r\n    If delIDs <> \"\" Then\n        For Each d In Split(Left$(delIDs, Len(delIDs) - 1), \"|\")\n            idx = FindIdx(lo, \"Bill ID\", CStr(d))\n            If idx > 0 Then lo.ListRows(idx).Delete: nD = nD + 1\n        Next d\n    End If\n    Application.ScreenUpdating = True\n    MsgBox \"Bill \" & sh.Range(\"C5\").Value & \" updated: \" & nU & \" changed, \" & nA & \" added, \" & nD & \" deleted.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Bil_Delete()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, lo As ListObject, r As Long, idx As Long, n As Long, paid As Double\n    Set sh = ActiveSheet\n    If Bil_Loaded(sh) = 0 Then\n        MsgBox \"Find the bill first (type the Bill No. in C5 and click Find Record).\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    paid = Application.WorksheetFunction.SumIfs(GetLO(\"tblPayments\").ListColumns(\"Amount (USD)\").DataBodyRange, GetLO(\"tblPayments\").ListColumns(\"Bill No.\").DataBodyRange, sh.Range(\"C5\").Value)\n    If MsgBox(\"Permanently delete bill \" & sh.Range(\"C5\").Value & \" and its \" & Bil_Loaded(sh) & \" line(s)?\" & IIf(paid > 0, vbCrLf & \"WARNING: US$\" & Format(paid, \"#,##0.00\") & \" in payments is linked to this bill.\", \"\") & vbCrLf & \"This cannot be undone.\", vbYesNo + vbCritical, \"CMU Database\") <> vbYes Then Exit Sub\n    Set lo = GetLO(\"tblBills\")\n    For r = 17 To 26\n        If CStr(sh.Range(\"G\" & r).Value) <> \"\" Then\n            idx = FindIdx(lo, \"Bill ID\", CStr(sh.Range(\"G\" & r).Value))\n            If idx > 0 Then lo.ListRows(idx).Delete: n = n + 1\n        End If\n    Next r\n    Bil_ClearForm sh\n    MsgBox n & \" line(s) deleted.\", vbInformation, \"CMU Database\"\nEnd Sub\n\nPublic Sub Bil_Clear()\n    Bil_ClearForm ActiveSheet\nEnd Sub\nRem ==== END BILL FORM ====\nRem ==== CREATE BILL FROM RECORD (licence / clearance -> Bill Form) ====\nPrivate Function Svc_For(ByVal cat As String, ByVal typ As String) As String\n    If InStr(1, cat, \"(CRL)\", vbTextCompare) > 0 Then\n        Svc_For = \"Annual Chemical Registration License\"\n    ElseIf InStr(1, cat, \"(CIL)\", vbTextCompare) > 0 Then\n        Svc_For = \"Chemical Importation License\"\n    ElseIf InStr(1, cat, \"Dewatering\", vbTextCompare) > 0 Then\n        Svc_For = \"Underground Mine Dewatering and Retention License\"\n    ElseIf InStr(1, cat, \"(EDL)\", vbTextCompare) > 0 Then\n        Svc_For = \"Annual Effluent Discharge License\"\n    ElseIf InStr(1, cat, \"Fumigation\", vbTextCompare) > 0 Then\n        If InStr(1, typ, \"Accreditation\", vbTextCompare) > 0 Then Svc_For = \"Fumigation Service Provider Accreditation\" Else Svc_For = \"Fumigation Certificate\"\n    ElseIf InStr(1, cat, \"Transport\", vbTextCompare) > 0 Then\n        Svc_For = \"Chemical Transportation License\"\n    Else\n        Svc_For = \"Other Service\"\n    End If\nEnd Function\n\nPrivate Function Fee_For(ByVal svc As String) As Variant\n    Dim lf As ListObject, r As Variant\n    Fee_For = Empty\n    Set lf = GetLO(\"tblServices\")\n    r = Application.Match(svc, lf.ListColumns(\"Service\").DataBodyRange, 0)\n    If Not IsError(r) Then\n        If IsNumeric(lf.ListColumns(\"Suggested Fee (USD)\").DataBodyRange.Cells(r, 1).Value) And CStr(lf.ListColumns(\"Suggested Fee (USD)\").DataBodyRange.Cells(r, 1).Value) <> \"\" Then Fee_For = lf.ListColumns(\"Suggested Fee (USD)\").DataBodyRange.Cells(r, 1).Value\n    End If\nEnd Function\n\nPublic Sub Bill_FromRecord()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim sh As Worksheet, id As String\n    Set sh = ActiveSheet\n    Select Case sh.Name\n        Case \"Licence Form\", \"Clearance Form\": id = UCase$(Trim$(CStr(sh.Range(\"C5\").Value)))\n        Case \"Print CRL\", \"Print CIL\", \"Print EDL\", \"Print EDL RP\": id = UCase$(Trim$(CStr(sh.Range(\"J4\").Value)))\n        Case \"Print Clearance\": id = UCase$(Trim$(CStr(sh.Range(\"K4\").Value)))\n        Case Else: Exit Sub\n    End Select\n    If id = \"\" Then\n        MsgBox \"Save the record (or Find it) first, then click Create Bill.\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    Bill_FromID id\nEnd Sub\n\nPublic Sub Bill_FromID(ByVal id As String)\n    Dim bf As Worksheet, lo As ListObject, lb As ListObject, lc As ListObject\n    Dim co As String, svc As String, det As String, loc As String, bl As String, lic As String\n    Dim idx As Long, i As Long, r As Long, n As Long, fee As Variant, v As Variant, cr As Variant\n    id = UCase$(Trim$(id))\n    If Left$(id, 4) = \"LIC-\" Then\n        Set lo = GetLO(\"tblLicences\")\n        idx = FindIdx(lo, \"Record ID\", id)\n        If idx = 0 Then MsgBox id & \" was not found.\", vbExclamation, \"CMU Database\": Exit Sub\n        co = CStr(lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Company Name\")).Value)\n        loc = CStr(lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Location\")).Value)\n        svc = Svc_For(CStr(lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Licence Category\")).Value), CStr(lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Licence / Certificate Type\")).Value))\n        lic = CStr(lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Licence / Certificate No.\")).Value)\n        If lic <> \"\" Then det = \"Licence No. \" & lic\n    ElseIf Left$(id, 4) = \"CLN-\" Then\n        Set lo = GetLO(\"tblClearances\")\n        For i = 1 To lo.ListRows.Count\n            If UCase$(CStr(lo.DataBodyRange.Cells(i, ColIdx(lo, \"Clearance No.\")).Value)) = id Then\n                n = n + 1\n                If co = \"\" Then co = CStr(lo.DataBodyRange.Cells(i, ColIdx(lo, \"Company Name\")).Value)\n                v = CStr(lo.DataBodyRange.Cells(i, ColIdx(lo, \"B/L / Invoice / AWB No.\")).Value)\n                If v <> \"\" And InStr(1, \", \" & bl & \",\", \", \" & v & \",\") = 0 Then bl = IIf(bl = \"\", v, bl & \", \" & v)\n            End If\n        Next i\n        If n = 0 Then MsgBox id & \" was not found.\", vbExclamation, \"CMU Database\": Exit Sub\n        svc = \"Chemical Clearance\"\n        det = n & \" chemical line(s)\" & IIf(bl = \"\", \"\", \" under B/L \" & bl)\n        Set lc = GetLO(\"tblCompanies\")\n        cr = Application.Match(co, lc.ListColumns(\"Company Name\").DataBodyRange, 0)\n        If Not IsError(cr) Then loc = CStr(lc.ListColumns(\"Location\").DataBodyRange.Cells(cr, 1).Value)\n    Else\n        MsgBox \"Bills can be created from a licence (LIC-###) or a clearance (CLN-###).\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    Set lb = GetLO(\"tblBills\")\n    If lb.ListRows.Count > 0 Then\n        If Application.WorksheetFunction.CountIf(lb.ListColumns(\"Linked Record\").DataBodyRange, \"*\" & id & \"*\") > 0 Then\n            If MsgBox(id & \" has already been billed. Create another bill line for it?\", vbYesNo + vbQuestion, \"CMU Database\") <> vbYes Then Exit Sub\n        End If\n    End If\n    Set bf = ThisWorkbook.Worksheets(\"Bill Form\")\n    Clr_Prot bf\n    If CStr(bf.Range(\"C5\").Value) = \"\" And CStr(bf.Range(\"C6\").Value) = co And Application.WorksheetFunction.CountA(bf.Range(\"C17:C26\")) > 0 Then\n        If MsgBox(\"A new bill for \" & co & \" is already open on the Bill Form.\" & vbCrLf & \"Add \" & id & \" to that bill?\" & vbCrLf & vbCrLf & \"(No = start a new bill)\", vbYesNo + vbQuestion, \"CMU Database\") <> vbYes Then Bil_ClearForm bf\n    Else\n        Bil_ClearForm bf\n    End If\n    For r = 17 To 26\n        If Trim$(CStr(bf.Range(\"C\" & r).Value)) = \"\" Then Exit For\n    Next r\n    If r > 26 Then MsgBox \"The bill already has 10 lines.\", vbExclamation, \"CMU Database\": Exit Sub\n    bf.Range(\"C6\").Value = co\n    If CStr(bf.Range(\"C8\").Value) = \"\" Then bf.Range(\"C8\").Value = Type_For(svc)\n    If Group_OfType(CStr(bf.Range(\"C8\").Value)) <> Group_OfType(Type_For(svc)) Then\n        MsgBox svc & \" cannot go on a \" & bf.Range(\"C8\").Value & \" bill. Save or clear that bill first, then click Create Bill again.\", vbExclamation, \"CMU Database\"\n        Exit Sub\n    End If\n    If CStr(bf.Range(\"C7\").Value) = \"\" Then bf.Range(\"C7\").Value = Date\n    If CStr(bf.Range(\"C12\").Value) = \"\" And loc <> \"\" Then bf.Range(\"C12\").Value = loc\n    bf.Range(\"C\" & r).Value = svc\n    bf.Range(\"D\" & r).Value = det\n    fee = Fee_For(svc)\n    If Not IsEmpty(fee) Then bf.Range(\"E\" & r).Value = fee\n    bf.Range(\"C14\").Value = IIf(CStr(bf.Range(\"C14\").Value) = \"\", id, bf.Range(\"C14\").Value & \", \" & id)\n    bf.Activate\n    bf.Range(\"E\" & r).Select\n    MsgBox \"Bill line prepared for \" & co & \" (\" & svc & \").\" & vbCrLf & vbCrLf & \"Check or type the amount in E\" & r & \", add the Bill Ref. No., then click Save New.\" & vbCrLf & \"To bill several licences together, go back and click Create Bill on the next record before saving.\", vbInformation, \"CMU Database\"\nEnd Sub\nRem ==== END CREATE BILL ====\nRem ==== NEW BILL WIZARD (Main Menu > Create New Bill) ====\nPublic Sub Bill_New()\n    If Not CMU_CanEdit() Then Exit Sub\n    Dim ans As String, k As Long, svc As Variant, lt As String, typ As String, rec As String\n    Dim bf As Worksheet, r As Long, fee As Variant, i As Long, renew As VbMsgBoxResult\n    ans = InputBox(\"What kind of bill?\" & vbCrLf & vbCrLf & _\n        \"1  -  Chemical Registration License (CRL)\" & vbCrLf & _\n        \"2  -  Chemical Importation License (CIL)\" & vbCrLf & _\n        \"3  -  CRL + CIL together\" & vbCrLf & _\n        \"4  -  Effluent Discharge License (EDL)\" & vbCrLf & _\n        \"5  -  Effluent Discharge & Dewatering License\" & vbCrLf & _\n        \"6  -  Fumigation Certificate\" & vbCrLf & _\n        \"7  -  Chemical Clearance\" & vbCrLf & _\n        \"8  -  Chemical Transportation License\" & vbCrLf & _\n        \"9  -  Others (penalty, accreditation, combined...)\" & vbCrLf & vbCrLf & _\n        \"Type the number and click OK:\", \"Create New Bill\")\n    ans = Trim$(ans)\n    If ans = \"\" Then Exit Sub\n    If Not IsNumeric(ans) Then MsgBox \"Please type a number from 1 to 9.\", vbExclamation, \"CMU Database\": Exit Sub\n    k = CLng(ans)\n    Select Case k\n        Case 1: svc = Array(\"Annual Chemical Registration License\"): lt = \"Licence – New Application\": typ = \"CRL\"\n        Case 2: svc = Array(\"Chemical Importation License\"): lt = \"Licence – New Application\": typ = \"CIL\"\n        Case 3: svc = Array(\"Annual Chemical Registration License\", \"Chemical Importation License\"): lt = \"Licence – New Application\": typ = \"CRL + CIL\"\n        Case 4: svc = Array(\"Annual Effluent Discharge License\"): lt = \"Licence – New Application\": typ = \"EDL\"\n        Case 5: svc = Array(\"Effluent Discharge and Dewatering License\"): lt = \"Licence – New Application\": typ = \"Effluent & Dewatering\"\n        Case 6: svc = Array(\"Fumigation Certificate\"): lt = \"Fumigation\": typ = \"Fumigation\"\n        Case 7: svc = Array(\"Chemical Clearance\"): lt = \"Chemical Clearance\": typ = \"Chemical Clearance\"\n        Case 8: svc = Array(\"Chemical Transportation License\"): lt = \"Chemical Transportation\": typ = \"Chemical Transportation\"\n        Case 9: svc = Array(\"Penalty / Fine\"): lt = \"Penalty / Other\": typ = \"Other\"\n        Case Else: MsgBox \"Please type a number from 1 to 9.\", vbExclamation, \"CMU Database\": Exit Sub\n    End Select\n    If k = 1 Or k = 2 Or k = 3 Or k = 4 Or k = 5 Or k = 8 Then\n        renew = MsgBox(\"Is this a RENEWAL?\" & vbCrLf & vbCrLf & \"Yes = renewal letter\" & vbCrLf & \"No = new application letter\", vbYesNoCancel + vbQuestion, \"Create New Bill - \" & typ)\n        If renew = vbCancel Then Exit Sub\n        If renew = vbYes And k <> 8 Then lt = \"Licence – Renewal\"\n    End If\n    Rem optional: bill an existing licence / clearance record\n    If k <= 2 Or k = 4 Or k = 5 Or k = 7 Then\n        rec = UCase$(Trim$(InputBox(\"Optional: enter the saved \" & IIf(k = 7, \"Clearance No. (CLN-###)\", \"Licence Record ID (LIC-###)\") & \" to link and fill the company automatically.\" & vbCrLf & vbCrLf & \"Leave blank to choose the company yourself.\", \"Create New Bill - \" & typ)))\n    End If\n    If rec <> \"\" Then\n        If (Left$(rec, 4) = \"LIC-\" Or Left$(rec, 4) = \"CLN-\") Then\n            Set bf = ThisWorkbook.Worksheets(\"Bill Form\")\n            Clr_Prot bf\n            Bil_ClearForm bf\n            Bill_FromID rec\n            bf.Range(\"C8\").Value = lt\n            Exit Sub\n        Else\n            MsgBox rec & \" is not a LIC- or CLN- number. Continuing without a link.\", vbInformation, \"CMU Database\"\n        End If\n    End If\n    Set bf = ThisWorkbook.Worksheets(\"Bill Form\")\n    Clr_Prot bf\n    Bil_ClearForm bf\n    bf.Range(\"C7\").Value = Date\n    bf.Range(\"C8\").Value = lt\n    r = 17\n    For i = LBound(svc) To UBound(svc)\n        If CStr(svc(i)) <> \"\" Then\n            bf.Range(\"C\" & r).Value = svc(i)\n            fee = Fee_For(CStr(svc(i)))\n            If Not IsEmpty(fee) Then bf.Range(\"E\" & r).Value = fee\n            r = r + 1\n        End If\n    Next i\n    If k = 8 Then bf.Range(\"D17\").Value = \"for a total of ___ trucks\"\n    bf.Activate\n    bf.Range(\"C6\").Select\n    MsgBox \"New \" & typ & \" bill started on the Bill Form.\" & vbCrLf & vbCrLf & _\n        \"1. Choose the Company (C6)\" & vbCrLf & _\n        \"2. Check / type the amount(s) in column E\" & IIf(k = 9, \" and pick the service(s) in column C\", \"\") & vbCrLf & _\n        \"3. Add the Bill Ref. No. and contact person\" & vbCrLf & _\n        \"4. Click Save New - you will be offered the bill letter to print.\", vbInformation, \"CMU Database\"\nEnd Sub\nRem ==== END NEW BILL ====\nRem ==== POP-UP USERFORMS (built by Build_UserForms from Macro Setup column C) ====\nPublic Sub Show_BillForm()\n    If Not CMU_CanEdit() Then Exit Sub\n    ShowUF \"UF_Bill\", \"Bill_New\", \"\"\nEnd Sub\n\nPublic Sub Show_PayForm()\n    If Not CMU_CanEdit() Then Exit Sub\n    ShowUF \"UF_Pay\", \"\", \"Payment Form\"\nEnd Sub\n\nPublic Sub Show_CompanyForm()\n    If Not CMU_CanEdit() Then Exit Sub\n    ShowUF \"UF_Company\", \"\", \"Company Form\"\nEnd Sub\n\nPublic Sub Show_FindForm()\n    ShowUF \"UF_Find\", \"\", \"\"\nEnd Sub\n\nPrivate Sub ShowUF(ByVal nm As String, ByVal fallbackMacro As String, ByVal fallbackSheet As String)\n    Dim f As Object\n    On Error Resume Next\n    Set f = VBA.UserForms.Add(nm)\n    If Err.Number <> 0 Or f Is Nothing Then\n        Err.Clear\n        On Error GoTo 0\n        MsgBox \"The pop-up form \" & nm & \" is not installed yet.\" & vbCrLf & \"Run the macro Build_UserForms once (see the steps on the Macro Setup sheet).\", vbInformation, \"CMU Database\"\n        If fallbackMacro <> \"\" Then Application.Run fallbackMacro\n        If fallbackSheet <> \"\" Then ThisWorkbook.Worksheets(fallbackSheet).Activate\n        Exit Sub\n    End If\n    On Error GoTo 0\n    f.Show\nEnd Sub\n\nPrivate Function FormCode(ByVal nm As String) As String\n    Dim v As Variant, i As Long, inside As Boolean, s As String, t As String\n    v = ThisWorkbook.Worksheets(\"Macro Setup\").Range(\"C1:C3000\").Value\n    For i = 1 To UBound(v, 1)\n        t = CStr(v(i, 1))\n        If Not inside Then\n            If t = \"#FORM \" & nm Then inside = True\n        ElseIf t = \"#END \" & nm Then\n            Exit For\n        ElseIf t = \"#COMMON\" Then\n            s = s & FormCode(\"UF_COMMON\")\n        Else\n            s = s & t & vbLf\n        End If\n    Next i\n    FormCode = s\nEnd Function\n\nPrivate Function AddCtl(comp As Object, ByVal prog As String, ByVal nm As String, ByVal l As Single, ByVal t As Single, ByVal w As Single, ByVal h As Single, Optional ByVal cap As String = \"\") As Object\n    Dim c As Object\n    If nm = \"\" Then\n        Set c = comp.Designer.Controls.Add(prog)\n    Else\n        Set c = comp.Designer.Controls.Add(prog, nm)\n    End If\n    c.Left = l: c.Top = t: c.Width = w: c.Height = h\n    If cap <> \"\" Then\n        On Error Resume Next\n        c.Caption = cap\n        On Error GoTo 0\n    End If\n    Set AddCtl = c\nEnd Function\n\nPrivate Function NewForm(vbp As Object, ByVal nm As String, ByVal cap As String, ByVal w As Single, ByVal h As Single) As Object\n    Dim comp As Object\n    On Error Resume Next\n    Set comp = vbp.VBComponents(nm)\n    If Not comp Is Nothing Then vbp.VBComponents.Remove comp\n    Set comp = Nothing\n    On Error GoTo 0\n    Set comp = vbp.VBComponents.Add(3)\n    comp.Name = nm\n    comp.Properties(\"Caption\") = cap\n    comp.Properties(\"Width\") = w\n    comp.Properties(\"Height\") = h\n    Set NewForm = comp\nEnd Function\n\nPrivate Sub SetCode(comp As Object, ByVal nm As String)\n    With comp.CodeModule\n        If .CountOfLines > 0 Then .DeleteLines 1, .CountOfLines\n        .AddFromString FormCode(nm)\n    End With\nEnd Sub\n\nRem ==== UI THEME (runtime helpers used by the pop-up forms) ====\nPublic Function UI_CapsOn() As Boolean\n    On Error Resume Next\n    UI_CapsOn = ((UI_GetKeyState(20) And 1) <> 0)\nEnd Function\n\nPublic Sub UI_Unhover()\n    On Error Resume Next\n    If Not UI_HotBtn Is Nothing Then UI_HotBtn.Cool\n    Set UI_HotBtn = Nothing\nEnd Sub\n\nPublic Sub UI_Paint(ByVal b As Object, ByVal hot As Boolean)\n    On Error Resume Next\n    If Not b.Enabled Then\n        b.BackColor = RGB(214, 218, 224)\n        b.ForeColor = RGB(140, 146, 155)\n        Exit Sub\n    End If\n    b.ForeColor = RGB(255, 255, 255)\n    Select Case CStr(b.Tag)\n        Case \"P\": b.BackColor = IIf(hot, RGB(104, 158, 68), RGB(84, 130, 53))\n        Case \"D\": b.BackColor = IIf(hot, RGB(222, 58, 58), RGB(192, 0, 0))\n        Case \"B\": b.BackColor = IIf(hot, RGB(70, 140, 205), RGB(47, 117, 181))\n        Case \"F\"\n            b.BackColor = IIf(hot, RGB(208, 219, 233), RGB(228, 234, 242))\n            b.ForeColor = RGB(31, 78, 120)\n        Case \"FA\": b.BackColor = RGB(31, 78, 120)\n        Case Else: b.BackColor = IIf(hot, RGB(98, 108, 120), RGB(128, 138, 150))\n    End Select\nEnd Sub\n\nPublic Sub UI_Enable(ByVal b As Object, ByVal onOff As Boolean)\n    On Error Resume Next\n    If b.Enabled <> onOff Then b.Enabled = onOff\n    UI_Paint b, False\nEnd Sub\n\nPublic Sub UI_Status(ByVal f As Object, ByVal msg As String, Optional ByVal kind As String = \"i\")\n    Dim bg As Long, fg As Long\n    On Error Resume Next\n    Select Case kind\n        Case \"ok\": bg = RGB(226, 239, 218): fg = RGB(56, 87, 35)\n        Case \"w\": bg = RGB(255, 242, 204): fg = RGB(128, 96, 0)\n        Case \"e\": bg = RGB(252, 228, 228): fg = RGB(156, 0, 6)\n        Case Else: bg = RGB(232, 236, 241): fg = RGB(68, 84, 106)\n    End Select\n    f.Controls(\"lblStatusBg\").BackColor = bg\n    f.Controls(\"lblStatus\").ForeColor = fg\n    f.Controls(\"lblStatus\").Caption = msg\nEnd Sub\n\nPublic Sub UI_Mark(ByVal c As Object, ByVal ok As Boolean)\n    On Error Resume Next\n    If ok Then\n        If c.Enabled Then c.BackColor = RGB(255, 255, 255)\n        c.BorderColor = RGB(190, 196, 205)\n    Else\n        c.BackColor = RGB(253, 237, 237)\n        c.BorderColor = RGB(200, 40, 40)\n    End If\nEnd Sub\n\nPublic Function UI_Score(ByVal p As String) As Long\n    Dim s As Long\n    If Len(p) < 6 Then Exit Function\n    s = 1\n    If Len(p) >= 10 Then s = s + 1\n    If p Like \"*[A-Z]*\" And p Like \"*[a-z]*\" Then s = s + 1\n    If p Like \"*[0-9]*\" Then s = s + 1\n    If p Like \"*[!A-Za-z0-9]*\" Then s = s + 1\n    If s > 4 Then s = 4\n    UI_Score = s\nEnd Function\n\nPublic Sub UI_Strength(ByVal bar As Object, ByVal txt As Object, ByVal p As String, ByVal fullW As Single)\n    Dim f As Single, col As Long, cap As String\n    On Error Resume Next\n    If Len(p) = 0 Then\n        bar.Visible = False\n        txt.Caption = \"\"\n        Exit Sub\n    End If\n    Select Case UI_Score(p)\n        Case 0: f = 0.15: col = RGB(192, 0, 0): cap = \"Too short  -  at least 6 characters\"\n        Case 1: f = 0.35: col = RGB(237, 125, 49): cap = \"Weak  -  add capitals, numbers or symbols\"\n        Case 2: f = 0.6: col = RGB(191, 143, 0): cap = \"Fair\"\n        Case 3: f = 0.8: col = RGB(112, 173, 71): cap = \"Good\"\n        Case Else: f = 1: col = RGB(56, 142, 60): cap = \"Strong\"\n    End Select\n    bar.Width = fullW * f\n    bar.BackColor = col\n    bar.Visible = True\n    txt.ForeColor = col\n    txt.Caption = \"Strength:  \" & cap\nEnd Sub\n\nPublic Function UI_Norm(ByVal s As String) As String\n    Dim i As Long, ch As String, t As String, w As Variant, out As String\n    s = LCase$(s)\n    For i = 1 To Len(s)\n        ch = Mid$(s, i, 1)\n        If ch Like \"[a-z0-9]\" Then t = t & ch Else t = t & \" \"\n    Next i\n    For Each w In Split(t, \" \")\n        Select Case CStr(w)\n            Case \"\", \"inc\", \"ltd\", \"llc\", \"limited\", \"corp\", \"corporation\", \"company\", \"co\", \"the\", \"liberia\", \"lib\", \"and\", \"group\", \"plc\", \"sa\"\n            Case Else: out = out & CStr(w)\n        End Select\n    Next w\n    UI_Norm = out\nEnd Function\n\nRem ==== UI THEME (design-time builders) ====\nPrivate Sub UI_Font(ByVal c As Object, ByVal sz As Single, ByVal b As Boolean, ByVal col As Long)\n    On Error Resume Next\n    c.Font.Name = \"Segoe UI\"\n    c.Font.Size = sz\n    c.Font.Bold = b\n    c.ForeColor = col\nEnd Sub\n\nPrivate Function UI_IW(comp As Object) As Single\n    UI_IW = comp.Properties(\"Width\").Value - 6\n    On Error Resume Next\n    UI_IW = comp.Designer.InsideWidth\nEnd Function\n\nPrivate Function UI_IH(comp As Object) As Single\n    UI_IH = comp.Properties(\"Height\").Value - 30\n    On Error Resume Next\n    UI_IH = comp.Designer.InsideHeight\nEnd Function\n\nPrivate Function UI_Box(comp As Object, ByVal nm As String, ByVal l As Single, ByVal t As Single, ByVal w As Single, ByVal h As Single, ByVal col As Long, Optional ByVal border As Boolean = False) As Object\n    Dim c As Object\n    Set c = AddCtl(comp, \"Forms.Label.1\", nm, l, t, w, h)\n    c.Caption = \"\"\n    c.BackStyle = 1\n    c.BackColor = col\n    If border Then\n        c.BorderStyle = 1\n        c.BorderColor = RGB(214, 219, 226)\n    End If\n    Set UI_Box = c\nEnd Function\n\nPrivate Function UI_Txt(comp As Object, ByVal nm As String, ByVal cap As String, ByVal l As Single, ByVal t As Single, ByVal w As Single, ByVal h As Single, ByVal sz As Single, ByVal b As Boolean, ByVal col As Long) As Object\n    Dim c As Object\n    Set c = AddCtl(comp, \"Forms.Label.1\", nm, l, t, w, h, cap)\n    If cap = \"\" Then c.Caption = \"\"\n    c.BackStyle = 0\n    UI_Font c, sz, b, col\n    Set UI_Txt = c\nEnd Function\n\nPrivate Function UI_Cap(comp As Object, ByVal txt As String, ByVal l As Single, ByVal t As Single, Optional ByVal req As Boolean = False, Optional ByVal nm As String = \"\") As Object\n    Dim c As Object, a As Object, x As Single\n    Set c = UI_Txt(comp, nm, txt, l, t, 220, 13, 8.5, True, RGB(68, 84, 106))\n    On Error Resume Next\n    c.WordWrap = False\n    c.AutoSize = True\n    On Error GoTo 0\n    If req Then\n        x = c.Left + c.Width + 1\n        If c.Width >= 219 Then x = l + Len(txt) * 5 + 2\n        Set a = UI_Txt(comp, \"\", \"*\", x, t - 1, 10, 13, 9.5, True, RGB(200, 30, 30))\n    End If\n    Set UI_Cap = c\nEnd Function\n\nPrivate Function UI_In(comp As Object, ByVal prog As String, ByVal nm As String, ByVal l As Single, ByVal t As Single, ByVal w As Single, Optional ByVal h As Single = 20) As Object\n    Dim c As Object\n    Set c = AddCtl(comp, prog, nm, l, t, w, h)\n    UI_Font c, 10, False, RGB(33, 37, 41)\n    On Error Resume Next\n    c.BackColor = RGB(255, 255, 255)\n    c.SpecialEffect = 0\n    c.BorderStyle = 1\n    c.BorderColor = RGB(190, 196, 205)\n    On Error GoTo 0\n    Set UI_In = c\nEnd Function\n\nPrivate Function UI_Btn(comp As Object, ByVal nm As String, ByVal cap As String, ByVal l As Single, ByVal t As Single, ByVal w As Single, ByVal h As Single, ByVal kind As String) As Object\n    Dim c As Object\n    Set c = AddCtl(comp, \"Forms.CommandButton.1\", nm, l, t, w, h, cap)\n    c.Tag = kind\n    UI_Font c, 9.5, True, RGB(255, 255, 255)\n    On Error Resume Next\n    c.TakeFocusOnClick = False\n    On Error GoTo 0\n    UI_Paint c, False\n    Set UI_Btn = c\nEnd Function\n\nPrivate Function UI_New(vbp As Object, ByVal nm As String, ByVal title As String, ByVal subTitle As String, ByVal w As Single, ByVal h As Single) As Object\n    Dim comp As Object, iw As Single, ih As Single\n    Set comp = NewForm(vbp, nm, \"CMU Database  -  \" & title, w, h)\n    On Error Resume Next\n    comp.Properties(\"BackColor\") = RGB(243, 245, 248)\n    comp.Properties(\"StartUpPosition\") = 1\n    On Error GoTo 0\n    iw = UI_IW(comp): ih = UI_IH(comp)\n    UI_Box comp, \"lblBand\", 0, 0, iw, 58, RGB(31, 78, 120)\n    UI_Box comp, \"lblAccent\", 0, 58, iw, 3, RGB(84, 130, 53)\n    UI_Txt comp, \"lblBrand\", \"EPA LIBERIA    |    ERRS - CMU DATABASE\", 18, 8, iw - 36, 12, 7.5, True, RGB(155, 194, 230)\n    UI_Txt comp, \"lblTitle\", title, 18, 19, iw - 36, 22, 14, True, RGB(255, 255, 255)\n    UI_Txt comp, \"lblSub\", subTitle, 18, 40, iw - 36, 14, 8.5, False, RGB(221, 235, 247)\n    UI_Box comp, \"lblStatusLine\", 0, ih - 21, iw, 1, RGB(210, 215, 222)\n    UI_Box comp, \"lblStatusBg\", 0, ih - 20, iw, 20, RGB(232, 236, 241)\n    UI_Txt comp, \"lblStatus\", \"Ready\", 14, ih - 16, iw - 28, 14, 8.5, False, RGB(68, 84, 106)\n    Set UI_New = comp\nEnd Function\n\nPrivate Sub UI_Footer(comp As Object, ByVal okName As String, ByVal okCap As String, ByVal okW As Single, ByVal cancelName As String, ByVal cancelCap As String)\n    Dim iw As Single, ih As Single, c As Object\n    iw = UI_IW(comp): ih = UI_IH(comp)\n    Set c = UI_Btn(comp, cancelName, cancelCap, iw - 112, ih - 62, 96, 30, \"S\")\n    c.Cancel = True\n    If okName <> \"\" Then\n        Set c = UI_Btn(comp, okName, okCap, iw - 120 - okW, ih - 62, okW, 30, \"P\")\n        c.Default = True\n    End If\nEnd Sub\n\nPrivate Sub UI_BuildClass(vbp As Object)\n    Dim comp As Object\n    On Error Resume Next\n    Set comp = vbp.VBComponents(\"CMU_UIBtn\")\n    On Error GoTo 0\n    If comp Is Nothing Then\n        Set comp = vbp.VBComponents.Add(2)\n        comp.Name = \"CMU_UIBtn\"\n    End If\n    SetCode comp, \"CMU_UIBtn\"\nEnd Sub\n\nPrivate Function UI_Project() As Object\n    Dim vbp As Object, n As Long\n    On Error Resume Next\n    Set vbp = ThisWorkbook.VBProject\n    n = vbp.VBComponents.Count\n    If Err.Number <> 0 Or vbp Is Nothing Then\n        On Error GoTo 0\n        MsgBox \"Excel is blocking this step.\" & vbCrLf & vbCrLf & \"Go to File > Options > Trust Center > Trust Center Settings > Macro Settings and tick 'Trust access to the VBA project object model'. Then run this macro again.\", vbExclamation, \"CMU Database\"\n        Exit Function\n    End If\n    Set UI_Project = vbp\nEnd Function\n\nPublic Sub Build_UserForms()\n    Dim vbp As Object, f As Object, c As Object, i As Long\n    Dim iw As Single, ih As Single, x As Single, y As Single, fw As Single, hw As Single, ax As Single, tw As Single, w1 As Single\n    Set vbp = UI_Project()\n    If vbp Is Nothing Then Exit Sub\n    Application.ScreenUpdating = False\n    UI_BuildClass vbp\n\n    Rem --- CREATE NEW BILL ---\n    Set f = UI_New(vbp, \"UF_Bill\", \"Create New Bill\", \"Choose the bill type and the company, then add up to 5 services.\", 660, 560)\n    iw = UI_IW(f): ih = UI_IH(f)\n    UI_Box f, \"\", 16, 74, 190, 180, RGB(255, 255, 255), True\n    UI_Txt f, \"\", \"BILL TYPE\", 28, 82, 166, 12, 8, True, RGB(31, 78, 120)\n    UI_In f, \"Forms.ListBox.1\", \"lstType\", 28, 98, 166, 110\n    UI_Txt f, \"lblHint\", \"\", 28, 214, 166, 36, 8, False, RGB(68, 84, 106)\n    x = 232: fw = iw - x - 30: hw = (fw - 12) / 2\n    UI_Box f, \"\", 218, 74, iw - 234, 180, RGB(255, 255, 255), True\n    UI_Cap f, \"Company\", x, 84, True\n    UI_In f, \"Forms.ComboBox.1\", \"cboCompany\", x, 98, fw\n    UI_Txt f, \"lblCoInfo\", \"\", x, 121, fw, 26, 8, False, RGB(47, 117, 181)\n    UI_Cap f, \"Bill date\", x, 150, True\n    UI_In f, \"Forms.TextBox.1\", \"txtDate\", x, 164, 120\n    UI_Cap f, \"Bill Ref. No.\", x + 132, 150\n    UI_In f, \"Forms.TextBox.1\", \"txtRef\", x + 132, 164, fw - 132\n    UI_Cap f, \"Contact person\", x, 194\n    UI_In f, \"Forms.TextBox.1\", \"txtContact\", x, 208, hw\n    UI_Cap f, \"Position / Title\", x + hw + 12, 194\n    UI_In f, \"Forms.TextBox.1\", \"txtTitle\", x + hw + 12, 208, hw\n    ax = iw - 150\n    UI_Box f, \"\", 16, 266, iw - 32, 160, RGB(255, 255, 255), True\n    UI_Box f, \"\", 16, 266, iw - 32, 20, RGB(221, 228, 237)\n    UI_Txt f, \"\", \"#\", 26, 270, 14, 12, 8, True, RGB(68, 84, 106)\n    UI_Txt f, \"\", \"SERVICE\", 44, 270, 200, 12, 8, True, RGB(68, 84, 106)\n    UI_Txt f, \"\", \"DETAILS  (chemicals, trucks, B/L No. ...)\", 258, 270, ax - 266, 12, 8, True, RGB(68, 84, 106)\n    UI_Txt f, \"\", \"AMOUNT (US$)\", ax, 270, 118, 12, 8, True, RGB(68, 84, 106)\n    For i = 1 To 5\n        y = 292 + (i - 1) * 26\n        UI_Txt f, \"\", CStr(i), 27, y + 4, 14, 12, 9, True, RGB(128, 138, 150)\n        UI_In f, \"Forms.ComboBox.1\", \"cboSvc\" & i, 44, y, 206\n        UI_In f, \"Forms.TextBox.1\", \"txtDet\" & i, 258, y, ax - 266\n        UI_In f, \"Forms.TextBox.1\", \"txtAmt\" & i, ax, y, 118\n    Next i\n    Set c = UI_Txt(f, \"lblWords\", \"\", 16, 438, iw - 250, 28, 8, False, RGB(89, 89, 89))\n    c.Font.Italic = True\n    Set c = UI_Txt(f, \"lblTotal\", \"US$ 0.00\", iw - 226, 434, 210, 24, 15, True, RGB(31, 78, 120))\n    c.TextAlign = 3\n    UI_Footer f, \"cmdSave\", \"Save Bill\", 130, \"cmdCancel\", \"Cancel\"\n    SetCode f, \"UF_Bill\"\n\n    Rem --- RECORD PAYMENT ---\n    Set f = UI_New(vbp, \"UF_Pay\", \"Record Payment\", \"Record a payment or receipt against an existing bill.\", 520, 430)\n
