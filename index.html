, 152, hw\n    UI_Cap f, \"Other names recorded\", 18, 182\n    UI_In f, \"Forms.TextBox.1\", \"txtOther\", 18, 196, fw\n    UI_Footer f, \"cmdSave\", \"Save Company\", 130, \"cmdCancel\", \"Cancel\"\n    SetCode f, \"UF_Company\"\n\n    Rem --- FIND / PRINT ---\n    Set f = UI_New(vbp, \"UF_Find\", \"Find / Print a Record\", \"Search companies, licences, clearances, bills and payments  -  results appear as you type.\", 720, 504)\n    iw = UI_IW(f): ih = UI_IH(f): fw = iw - 36\n    UI_Cap f, \"Search\", 18, 70\n    Set c = UI_In(f, \"Forms.TextBox.1\", \"txtQ\", 18, 84, fw, 24)\n    c.Font.Size = 11\n    x = 18\n    For i = 0 To 5\n        w1 = Array(56, 84, 76, 84, 60, 76)(i)\n        Set c = UI_Btn(f, \"tab\" & i, Array(\"All\", \"Companies\", \"Licences\", \"Clearances\", \"Bills\", \"Payments\")(i), x, 116, w1, 22, IIf(i = 0, \"FA\", \"F\"))\n        c.Font.Size = 9\n        x = x + w1 + 6\n    Next i\n    UI_Box f, \"\", 18, 146, fw, 20, RGB(221, 228, 237)\n    x = 22\n    For i = 0 To 4\n        w1 = Array(72, 82, 222, 192, 80)(i)\n        UI_Txt f, \"\", Array(\"TYPE\", \"ID\", \"COMPANY\", \"REFERENCE / DETAILS\", \"DATE\")(i), x, 150, w1 - 4, 12, 8, True, RGB(68, 84, 106)\n        x = x + w1\n    Next i\n    Set c = UI_In(f, \"Forms.ListBox.1\", \"lstRes\", 18, 166, fw, 232)\n    c.Font.Size = 9.5\n    UI_Txt f, \"\", \"Tip:  double-click a result to open it   |   Down arrow moves into the list   |   Esc closes\", 18, ih - 53, iw - 400, 24, 8, False, RGB(128, 138, 150)\n    Set c = UI_Btn(f, \"cmdClose\", \"Close\", iw - 112, ih - 62, 96, 30, \"S\")\n    c.Cancel = True\n    UI_Btn f, \"cmdPrint\", \"Print Page\", iw - 230, ih - 62, 110, 30, \"B\"\n    UI_Btn f, \"cmdOpen\", \"Open Record\", iw - 348, ih - 62, 110, 30, \"P\"\n    SetCode f, \"UF_Find\"\n\n    Application.ScreenUpdating = True\n    MsgBox \"The pop-up forms were rebuilt with the new design:\" & vbCrLf & \"Create New Bill, Record Payment, Register Company and Find / Print.\" & vbCrLf & vbCrLf & \"Next run Build_LoginForms, then Setup_Buttons, then save the file.\", vbInformation, \"CMU Database\"\nEnd Sub\nRem ==== END POP-UP USERFORMS ====\nRem ==== SAVE AS WORD (print pages -> editable .docx) ====\nPrivate Function Prn_FileName(sh As Worksheet) As String\n    Dim nm As String, ch As Variant\n    If sh.Name = \"Print Bill\" Then\n        nm = \"Bill \" & sh.Range(\"K4\").Value & \" \" & sh.Range(\"J12\").Value\n    ElseIf sh.Name = \"Print Clearance\" Then\n        nm = \"Clearance \" & sh.Range(\"K4\").Value & \" \" & sh.Range(\"J8\").Value\n    Else\n        nm = sh.Name & \" \" & sh.Range(\"J7\").Value & \" \" & sh.Range(\"J8\").Value\n    End If\n    For Each ch In Array(\"/\", \"\\\", \":\", \"*\", \"?\", \"\"\"\", \"<\", \">\", \"|\")\n        nm = Replace(nm, ch, \"-\")\n    Next ch\n    Prn_FileName = Trim$(nm)\nEnd Function\n\nPublic Sub Print_Word()\n    Rem Saves the print page as PDF first (exact layout, logos, bold text), then lets Word convert that PDF into an editable .docx\n    Dim sh As Worksheet, wd As Object, doc As Object, f As String, tmp As String, created As Boolean\n    Set sh = ActiveSheet\n    If Not Prn_OK(sh) Then Exit Sub\n    f = ThisWorkbook.Path & Application.PathSeparator & Prn_FileName(sh) & \".docx\"\n    tmp = Environ$(\"TEMP\") & Application.PathSeparator & \"CMU_\" & Format(Now, \"yyyymmddhhnnss\") & \".pdf\"\n    Application.ScreenUpdating = False\n    Prn_Rows sh, True: Prn_Logos sh, True: Prn_Bold sh, True: Prn_FitRows sh\n    sh.ExportAsFixedFormat Type:=xlTypePDF, Filename:=tmp, Quality:=xlQualityStandard, IgnorePrintAreas:=False, OpenAfterPublish:=False\n    Prn_Rows sh, False: Prn_Logos sh, False: Prn_Bold sh, False\n    Application.ScreenUpdating = True\n    On Error Resume Next\n    Set wd = GetObject(, \"Word.Application\")\n    If wd Is Nothing Then Set wd = CreateObject(\"Word.Application\"): created = True\n    On Error GoTo 0\n    If wd Is Nothing Then MsgBox \"Microsoft Word could not be started on this computer.\", vbCritical, \"CMU Database\": Exit Sub\n    wd.DisplayAlerts = 0\n    On Error Resume Next\n    Set doc = wd.Documents.Open(Filename:=tmp, ConfirmConversions:=False, ReadOnly:=False, AddToRecentFiles:=False)\n    If doc Is Nothing Then\n        On Error GoTo 0\n        MsgBox \"Word could not open the page. Make sure Word 2013 or newer is installed.\", vbCritical, \"CMU Database\"\n        Exit Sub\n    End If\n    Err.Clear\n    doc.SaveAs2 Filename:=f, FileFormat:=16\n    If Err.Number <> 0 Then\n        Err.Clear\n        MsgBox \"The document opened in Word but could not be saved to:\" & vbCrLf & f & vbCrLf & \"Use File > Save As in Word.\", vbExclamation, \"CMU Database\"\n    Else\n        MsgBox \"Saved as Word: \" & f & vbCrLf & vbCrLf & \"It is open in Word - you can edit it before printing.\", vbInformation, \"CMU Database\"\n    End If\n    Kill tmp\n    On Error GoTo 0\n    wd.DisplayAlerts = -1\n    wd.Visible = True\n    wd.Activate\nEnd Sub\nRem ==== END SAVE AS WORD ====\nRem ==== USER LOGIN (Login sheet, Users sheet = very hidden) ====\n\nPublic Function CMU_Hash(ByVal salt As String, ByVal pwd As String) As String\n    Dim s As String, i As Long, j As Long, h1 As Double, h2 As Double, c As Long, out As String\n    s = salt & \"|CMU-ERRS|\" & pwd\n    h1 = 5381: h2 = 52711\n    For j = 1 To 64\n        For i = 1 To Len(s)\n            c = AscW(Mid$(s, i, 1)) And &HFFFF&\n            h1 = h1 * 33 + c + j: h1 = h1 - Int(h1 / 4294967291#) * 4294967291#\n            h2 = h2 * 31 + c * 7 + j: h2 = h2 - Int(h2 / 4294967279#) * 4294967279#\n        Next i\n    Next j\n    out = Right$(\"0000000000\" & CStr(h1), 10) & Right$(\"0000000000\" & CStr(h2), 10)\n    CMU_Hash = out\nEnd Function\n\nPrivate Function UserRow(ByVal un As String) As Long\n    Dim lo As ListObject, i As Long\n    Set lo = GetLO(\"tblUsers\")\n    For i = 1 To lo.ListRows.Count\n        If LCase$(Trim$(CStr(lo.DataBodyRange.Cells(i, 1).Value))) = LCase$(Trim$(un)) Then UserRow = i: Exit Function\n    Next i\nEnd Function\n\nPublic Function CMU_CheckLogin(ByVal un As String, ByVal pwd As String) As String\n    Dim lo As ListObject, r As Long\n    Set lo = GetLO(\"tblUsers\")\n    r = UserRow(un)\n    If r = 0 Then CMU_CheckLogin = \"Unknown username.\": Exit Function\n    If UCase$(CStr(lo.DataBodyRange.Cells(r, 4).Value)) <> \"YES\" Then CMU_CheckLogin = \"This account is disabled. Ask the administrator.\": Exit Function\n    If CStr(lo.DataBodyRange.Cells(r, 6).Value) = \"\" Then\n        If LCase$(un) = \"admin\" And pwd = \"admin123\" Then\n            CMU_CheckLogin = \"FIRST\"\n        Else\n            CMU_CheckLogin = \"Wrong password.\"\n        End If\n    ElseIf CMU_Hash(CStr(lo.DataBodyRange.Cells(r, 5).Value), pwd) <> CStr(lo.DataBodyRange.Cells(r, 6).Value) Then\n        CMU_CheckLogin = \"Wrong password.\"\n    Else\n        CMU_CheckLogin = \"OK\"\n    End If\nEnd Function\n\nPublic Sub CMU_SetPassword(ByVal un As String, ByVal pwd As String)\n    Dim lo As ListObject, r As Long, salt As String\n    Set lo = GetLO(\"tblUsers\")\n    r = UserRow(un)\n    If r = 0 Then Exit Sub\n    Randomize\n    salt = Format(Now, \"yymmddhhnnss\") & CStr(Int(Rnd * 1000000))\n    lo.DataBodyRange.Cells(r, 5).Value = \"'\" & salt\n    lo.DataBodyRange.Cells(r, 6).Value = \"'\" & CMU_Hash(salt, pwd)\nEnd Sub\n\nPublic Sub CMU_AfterLogin(ByVal un As String)\n    Dim lo As ListObject, r As Long, ws As Worksheet\n    Set lo = GetLO(\"tblUsers\")\n    r = UserRow(un)\n    CMU_User = CStr(lo.DataBodyRange.Cells(r, 1).Value)\n    CMU_Role = CStr(lo.DataBodyRange.Cells(r, 3).Value)\n    lo.DataBodyRange.Cells(r, 8).Value = Now\n    Application.ScreenUpdating = False\n    On Error Resume Next\n    ThisWorkbook.Unprotect CMU_LOCKPWD\n    On Error GoTo 0\n    ThisWorkbook.Worksheets(\"Users\").Range(\"J1\").Value = CMU_Role\n    For Each ws In ThisWorkbook.Worksheets\n        If ws.Name <> \"Users\" Then ws.Visible = xlSheetVisible\n    Next ws\n    If CMU_Role <> \"Admin\" Then\n        For Each ws In ThisWorkbook.Worksheets\n            If ws.Name = \"Macro Setup\" Or ws.Name = \"Lists\" Or ws.Name = \"Fee Schedule\" Then ws.Visible = xlSheetHidden\n        Next ws\n    End If\n    ThisWorkbook.Worksheets(\"Main Menu\").Range(\"F3\").Value = \"Signed in: \" & lo.DataBodyRange.Cells(r, 2).Value & \" (\" & CMU_Role & \")\"\n    ThisWorkbook.Worksheets(\"Main Menu\").Activate\n    ThisWorkbook.Worksheets(\"Login\").Visible = xlSheetHidden\n    Application.ScreenUpdating = True\n    CMU_ApplyRights\nEnd Sub\n\nPublic Sub CMU_LockAll()\n    Dim ws As Worksheet\n    Application.ScreenUpdating = False\n    On Error Resume Next\n    ThisWorkbook.Unprotect CMU_LOCKPWD\n    ThisWorkbook.Worksheets(\"Users\").Range(\"J1\").Value = \"\"\n    On Error GoTo 0\n    With ThisWorkbook.Worksheets(\"Login\")\n        .Visible = xlSheetVisible\n        .Activate\n    End With\n    For Each ws In ThisWorkbook.Worksheets\n        If ws.Name <> \"Login\" Then\n            If ws.Name = \"Users\" Then ws.Visible = xlSheetVeryHidden Else ws.Visible = xlSheetVeryHidden\n        End If\n    Next ws\n    CMU_User = \"\": CMU_Role = \"\"\n    On Error Resume Next\n    ThisWorkbook.Worksheets(\"Main Menu\").Range(\"F3\").Value = \"Not signed in\"\n    On Error GoTo 0\n    Application.ScreenUpdating = True\nEnd Sub\n\nPublic Sub CMU_Logout()\n    If MsgBox(\"Log out of the CMU Database?\", vbYesNo + vbQuestion, \"CMU Database\") <> vbYes Then Exit Sub\n    CMU_LockAll\n    ThisWorkbook.Save\nEnd Sub\n\nPublic Sub Show_LoginForm()\n    ShowUF \"UF_Login\", \"\", \"\"\nEnd Sub\n\nPublic Sub Show_UsersForm()\n    If SessRole() <> \"Admin\" Then MsgBox \"Only an Admin can manage users.\", vbExclamation, \"CMU Database\": Exit Sub\n    ShowUF \"UF_Users\", \"\", \"\"\nEnd Sub\n\nPublic Sub Show_MyPwdForm()\n    If CMU_User = \"\" Then MsgBox \"Please sign in first.\", vbExclamation, \"CMU Database\": Exit Sub\n    ShowUF \"UF_MyPwd\", \"\", \"\"\nEnd Sub\n\nPublic Sub Build_LoginForms()\n    Dim vbp As Object, f As Object, c As Object, i As Long\n    Dim iw As Single, ih As Single, fw As Single, hw As Single, qw As Single, x As Single, x2 As Single, w1 As Single\n    Set vbp = UI_Project()\n    If vbp Is Nothing Then Exit Sub\n    Application.ScreenUpdating = False\n    UI_BuildClass vbp\n\n    Rem --- SIGN IN ---\n    Set f = UI_New(vbp, \"UF_Login\", \"Sign In\", \"Enter your username and password to continue.\", 360, 350)\n    iw = UI_IW(f): ih = UI_IH(f): fw = iw - 68\n    UI_Box f, \"\", 18, 74, iw - 36, 170, RGB(255, 255, 255), True\n    UI_Cap f, \"Username\", 34, 86, False, \"capUser\"\n    UI_In f, \"Forms.TextBox.1\", \"txtUser\", 34, 100, fw, 22\n    UI_Cap f, \"Password\", 34, 130, False, \"capPwd\"\n    Set c = UI_In(f, \"Forms.TextBox.1\", \"txtPwd\", 34, 144, fw, 22)\n    c.PasswordChar = \"*\"\n    UI_Txt f, \"lblCaps\", \"Caps Lock is ON\", 34, 168, fw, 12, 8, True, RGB(191, 143, 0)\n    UI_Cap f, \"New password\", 34, 86, False, \"capNew1\"\n    Set c = UI_In(f, \"Forms.TextBox.1\", \"txtNew1\", 34, 100, fw, 22)\n    c.PasswordChar = \"*\"\n    UI_Box f, \"lblStrBg\", 34, 124, fw, 4, RGB(225, 229, 235)\n    UI_Box f, \"lblStrBar\", 34, 124, fw, 4, RGB(192, 0, 0)\n    UI_Txt f, \"lblStrTxt\", \"\", 34, 129, fw, 12, 7.5, True, RGB(128, 138, 150)\n    UI_Cap f, \"Confirm new password\", 34, 144, False, \"capNew2\"\n    Set c = UI_In(f, \"Forms.TextBox.1\", \"txtNew2\", 34, 158, fw, 22)\n    c.PasswordChar = \"*\"\n    UI_Txt f, \"lblMsg\", \"\", 34, 186, fw, 28, 8.5, True, RGB(192, 0, 0)\n    UI_Footer f, \"cmdOK\", \"Sign In\", 120, \"cmdCancel\", \"Cancel\"\n    SetCode f, \"UF_Login\"\n\n    Rem --- CHANGE MY PASSWORD ---\n    Set f = UI_New(vbp, \"UF_MyPwd\", \"Change My Password\", \"\", 360, 352)\n    iw = UI_IW(f): ih = UI_IH(f): fw = iw - 68\n    UI_Box f, \"\", 18, 74, iw - 36, 172, RGB(255, 255, 255), True\n    UI_Cap f, \"Current password\", 34, 84, True\n    Set c = UI_In(f, \"Forms.TextBox.1\", \"txtOld\", 34, 98, fw, 22)\n    c.PasswordChar = \"*\"\n    UI_Cap f, \"New password\", 34, 126, True\n    Set c = UI_In(f, \"Forms.TextBox.1\", \"txtNew\", 34, 140, fw, 22)\n    c.PasswordChar = \"*\"\n    UI_Box f, \"lblStrBg\", 34, 164, fw, 4, RGB(225, 229, 235)\n    Set c = UI_Box(f, \"lblStrBar\", 34, 164, fw, 4, RGB(192, 0, 0))\n    c.Visible = False\n    UI_Txt f, \"lblStrTxt\", \"\", 34, 169, fw, 12, 7.5, True, RGB(128, 138, 150)\n    UI_Cap f, \"Confirm new password\", 34, 184, True\n    Set c = UI_In(f, \"Forms.TextBox.1\", \"txtNew2\", 34, 198, fw, 22)\n    c.PasswordChar = \"*\"\n    UI_Txt f, \"lblMsg\", \"\", 34, 224, fw, 14, 8.5, True, RGB(192, 0, 0)\n    UI_Footer f, \"cmdOK\", \"Save Password\", 130, \"cmdCancel\", \"Cancel\"\n    SetCode f, \"UF_MyPwd\"\n\n    Rem --- USERS & PASSWORDS ---\n    Set f = UI_New(vbp, \"UF_Users\", \"Users & Passwords\", \"Admin only  -  add staff, set roles and reset passwords.\", 580, 460)\n    iw = UI_IW(f): ih = UI_IH(f): fw = iw - 36\n    UI_Txt f, \"\", \"USER ACCOUNTS\", 18, 69, 200, 12, 8, True, RGB(31, 78, 120)\n    UI_Box f, \"\", 18, 84, fw, 18, RGB(221, 228, 237)\n    x = 22\n    For i = 0 To 4\n        w1 = Array(92, 172, 72, 52, 120)(i)\n        UI_Txt f, \"\", Array(\"USERNAME\", \"FULL NAME\", \"ROLE\", \"ACTIVE\", \"LAST SIGN-IN\")(i), x, 87, w1 - 4, 12, 8, True, RGB(68, 84, 106)\n        x = x + w1\n    Next i\n    Set c = UI_In(f, \"Forms.ListBox.1\", \"lstU\", 18, 102, fw, 112)\n    c.Font.Size = 9.5\n    UI_Box f, \"\", 18, 224, fw, 128, RGB(255, 255, 255), True\n    UI_Txt f, \"lblEditHdr\", \"NEW USER\", 30, 230, fw - 24, 12, 8, True, RGB(31, 78, 120)\n    hw = (fw - 36) / 2: x2 = 30 + hw + 12: qw = (hw - 8) / 2\n    UI_Cap f, \"Username\", 30, 246, True\n    UI_In f, \"Forms.TextBox.1\", \"txtUser\", 30, 260, hw\n    UI_Cap f, \"Full name\", x2, 246\n    UI_In f, \"Forms.TextBox.1\", \"txtName\", x2, 260, hw\n    UI_Cap f, \"Role\", 30, 286, True\n    UI_In f, \"Forms.ComboBox.1\", \"cboRole\", 30, 300, qw\n    UI_Cap f, \"Active\", 30 + qw + 8, 286\n    UI_In f, \"Forms.ComboBox.1\", \"cboActive\", 30 + qw + 8, 300, qw\n    UI_Cap f, \"Password\", x2, 286\n    Set c = UI_In(f, \"Forms.TextBox.1\", \"txtPwd\", x2, 300, hw)\n    c.PasswordChar = \"*\"\n    UI_Box f, \"lblStrBg\", x2, 322, hw, 4, RGB(225, 229, 235)\n    Set c = UI_Box(f, \"lblStrBar\", x2, 322, hw, 4, RGB(192, 0, 0))\n    c.Visible = False\n    UI_Txt f, \"lblStrTxt\", \"\", x2, 327, hw, 12, 7.5, True, RGB(128, 138, 150)\n    UI_Txt f, \"lblRoleInfo\", \"\", 30, 324, hw, 24, 7.5, False, RGB(128, 138, 150)\n    UI_Btn f, \"cmdNew\", \"New User\", 18, ih - 62, 96, 30, \"B\"\n    Set c = UI_Btn(f, \"cmdSave\", \"Save User\", 122, ih - 62, 104, 30, \"P\")\n    c.Default = True\n    UI_Btn f, \"cmdDel\", \"Delete\", 234, ih - 62, 84, 30, \"D\"\n    Set c = UI_Btn(f, \"cmdClose\", \"Close\", iw - 112, ih - 62, 96, 30, \"S\")\n    c.Cancel = True\n    SetCode f, \"UF_Users\"\n\n    Application.ScreenUpdating = True\n    MsgBox \"Sign-in forms rebuilt with the new design.\" & vbCrLf & vbCrLf & \"First sign-in: username  admin   password  admin123\" & vbCrLf & \"You will be asked to choose a new password straight away.\", vbInformation, \"CMU Database\"\nEnd Sub\nRem ==== END USER LOGIN ====\nRem ==== ACCESS RIGHTS (Viewer = read-only) ====\nPublic Function SessRole() As String\n    On Error Resume Next\n    SessRole = CStr(ThisWorkbook.Worksheets(\"Users\").Range(\"J1\").Value)\n    If SessRole = \"\" Then SessRole = CMU_Role\nEnd Function\n\nPublic Function CMU_CanEdit() As Boolean\n    Dim r As String\n    r = SessRole()\n    If r = \"\" Then\n        MsgBox \"Please sign in first.\", vbExclamation, \"CMU Database\"\n        CMU_CanEdit = False\n    ElseIf r = \"Viewer\" Then\n        MsgBox \"Your account is VIEW ONLY.\" & vbCrLf & vbCrLf & \"You can search, view and print records, but you cannot add, change or delete anything.\", vbExclamation, \"CMU Database\"\n        CMU_CanEdit = False\n    Else\n        CMU_CanEdit = True\n    End If\nEnd Function\n\nPublic Sub CMU_ApplyRights()\n    Dim ws As Worksheet, f As Variant, isViewer As Boolean\n    isViewer = (SessRole() = \"Viewer\")\n    For Each ws In ThisWorkbook.Worksheets\n        On Error Resume Next\n        ws.Unprotect CMU_LOCKPWD\n        ws.Unprotect\n        On Error GoTo 0\n    Next ws\n    If isViewer Then\n        For Each ws In ThisWorkbook.Worksheets\n            If ws.Visible = xlSheetVisible Then\n                ws.Protect Password:=CMU_LOCKPWD, DrawingObjects:=True, Contents:=True, Scenarios:=True, UserInterfaceOnly:=True\n                If Left$(ws.Name, 6) = \"Print \" Then\n                    ws.EnableSelection = xlUnlockedCells\n                Else\n                    ws.EnableSelection = xlNoSelection\n                End If\n            End If\n        Next ws\n        ThisWorkbook.Protect Password:=CMU_LOCKPWD, Structure:=True\n    Else\n        For Each f In Array(\"Company Form\", \"Licence Form\", \"Clearance Form\", \"Bill Form\", \"Payment Form\")\n            Set ws = ThisWorkbook.Worksheets(f)\n            ws.Protect DrawingObjects:=True, Contents:=True, UserInterfaceOnly:=True\n            ws.EnableSelection = xlUnlockedCells\n        Next f\n    End If\nEnd Sub\nRem ==== END ACCESS RIGHTS ====\n\nRem ==== LICENCE FORM - CHEMICAL LINES (Licence Form rows 20-34 <-> tblLicenceChemicals) ====\nPrivate Function Lic_ChemCols() As Variant\n    Lic_ChemCols = Array(\"Trade or IUPAC Name\", \"EPA Registration No.\", \"Type\", \"Stipulated Qty\", \"Unit\", \"Consignment Ref. (BL/IPD No.)\")\nEnd Function\n\nPrivate Sub Lic_ClearChems(sh As Worksheet)\n    sh.Range(\"C20:H34\").ClearContents: Eff_Clear sh\nEnd Sub\n\nPrivate Function Lic_CountFor(ByVal licID As String) As Long\n    Dim lo As ListObject, i As Long\n    Set lo = GetLO(\"tblLicenceChemicals\")\n    For i = 1 To lo.ListRows.Count\n        If UCase$(Trim$(CStr(lo.DataBodyRange.Cells(i, 1).Value))) = UCase$(licID) Then Lic_CountFor = Lic_CountFor + 1\n    Next i\nEnd Function\n\nPrivate Function Lic_ChemsOK(sh As Worksheet) As Boolean\n    Dim r As Long, bad As String, n As Long, cat As String\n    Lic_ChemsOK = True\n    If sh.Name <> \"Licence Form\" Then Exit Function\n    For r = 20 To 34\n        If Trim$(CStr(sh.Cells(r, 3).Value)) = \"\" Then\n            If Application.WorksheetFunction.CountA(sh.Range(\"D\" & r & \":H\" & r)) > 0 Then bad = bad & \" \" & (r - 19)\n        Else\n            n = n + 1\n        End If\n    Next r\n    If bad <> \"\" Then\n        MsgBox \"Chemical line(s)\" & bad & \" have details but no Trade or IUPAC Name.\" & vbCrLf & \"Type the name or clear the line, then try again.\", vbExclamation, \"CMU Database\"\n        Lic_ChemsOK = False\n        Exit Function\n    End If\n    If Not Eff_OK(sh) Then Lic_ChemsOK = False: Exit Function\n    cat = CStr(sh.Range(\"C7\").Value)\n    If n > 0 And InStr(1, cat, \"(CRL)\", vbTextCompare) = 0 And InStr(1, cat, \"(CIL)\", vbTextCompare) = 0 Then\n        Lic_ChemsOK = (MsgBox(n & \" chemical line(s) are entered but the category is not CRL or CIL.\" & vbCrLf & \"Save them anyway?\", vbYesNo + vbQuestion, \"CMU Database\") = vbYes)\n    End If\nEnd Function\n\nPrivate Sub Lic_DeleteChems(ByVal licID As String)\n    Dim lo As ListObject, i As Long, c As Long\n    Set lo = GetLO(\"tblLicenceChemicals\")\n    For i = lo.ListRows.Count To 1 Step -1\n        If UCase$(Trim$(CStr(lo.DataBodyRange.Cells(i, 1).Value))) = UCase$(licID) Then\n            If lo.ListRows.Count = 1 Then\n                lo.DataBodyRange.Cells(1, 1).ClearContents\n                For c = 4 To lo.ListColumns.Count\n                    lo.DataBodyRange.Cells(1, c).ClearContents\n                Next c\n            Else\n                lo.ListRows(i).Delete\n            End If\n        End If\n    Next i\nEnd Sub\n\nPrivate Sub Lic_SaveChems(sh As Worksheet, ByVal licID As String)\n    Dim lo As ListObject, r As Long, idx As Long, k As Long, cols As Variant, fB As String, fC As String\n    If sh.Name <> \"Licence Form\" Then Exit Sub\n    Eff_Save sh, licID\n    licID = UCase$(Trim$(licID))\n    If Lic_CountFor(licID) > 15 Then\n        MsgBox licID & \" has more than 15 chemical lines, so its chemicals were NOT changed from the form.\" & vbCrLf & \"Edit them on the Licence Chemicals sheet.\", vbInformation, \"CMU Database\"\n        Exit Sub\n    End If\n    fB = \"=IF([@[Licence Record ID]]=\"\"\"\",\"\"\"\",IFERROR(INDEX(tblLicences[Licence / Certificate No.],MATCH([@[Licence Record ID]],tblLicences[Record ID],0))&\"\"\"\",\"\"Unknown ID\"\"))\"\n    fC = \"=IF([@[Licence Record ID]]=\"\"\"\",\"\"\"\",IFERROR(INDEX(tblLicences[Company Name],MATCH([@[Licence Record ID]],tblLicences[Record ID],0)),\"\"Unknown ID\"\"))\"\n    cols = Lic_ChemCols()\n    Set lo = GetLO(\"tblLicenceChemicals\")\n    Lic_DeleteChems licID\n    For r = 20 To 34\n        If Trim$(CStr(sh.Cells(r, 3).Value)) <> \"\" Then\n            idx = 0\n            If lo.ListRows.Count = 1 Then\n                If CStr(lo.DataBodyRange.Cells(1, 1).Value) = \"\" And CStr(lo.DataBodyRange.Cells(1, 4).Value) = \"\" Then idx = 1\n            End If\n            If idx = 0 Then idx = lo.ListRows.Add(AlwaysInsert:=True).Index\n            lo.DataBodyRange.Cells(idx, 1).Value = licID\n            lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Licence No.\")).Formula = fB\n            lo.DataBodyRange.Cells(idx, ColIdx(lo, \"Company\")).Formula = fC\n            For k = 0 To 5\n                If CStr(sh.Cells(r, 3 + k).Value) = \"\" Then\n                    lo.DataBodyRange.Cells(idx, ColIdx(lo, CStr(cols(k)))).ClearContents\n                Else\n                    lo.DataBodyRange.Cells(idx, ColIdx(lo, CStr(cols(k)))).Value = sh.Cells(r, 3 + k).Value\n                End If\n            Next k\n        End If\n    Next r\nEnd Sub\n\nPrivate Sub Lic_LoadChems(sh As Worksheet, ByVal licID As String)\n    Dim lo As ListObject, i As Long, r As Long, k As Long, more As Long, cols As Variant\n    Lic_ClearChems sh\n    Eff_Load sh, licID\n    cols = Lic_ChemCols()\n    Set lo = GetLO(\"tblLicenceChemicals\")\n    r = 20\n    For i = 1 To lo.ListRows.Count\n        If UCase$(Trim$(CStr(lo.DataBodyRange.Cells(i, 1).Value))) = UCase$(licID) Then\n            If r > 34 Then\n                more = more + 1\n            Else\n                For k = 0 To 5\n                    sh.Cells(r, 3 + k).Value = lo.DataBodyRange.Cells(i, ColIdx(lo, CStr(cols(k)))).Value\n                Next k\n                r = r + 1\n            End If\n        End If\n    Next i\n    If more > 0 Then MsgBox licID & \" has \" & (15 + more) & \" chemical lines; only the first 15 are shown.\" & vbCrLf & \"Change its chemicals on the Licence Chemicals sheet.\", vbInformation, \"CMU Database\"\nEnd Sub\nRem ==== END LICENCE CHEMICAL LINES ====\n\nRem ==== LICENCE FORM - EFFLUENT DETAILS (Licence Form rows 39-97 <-> tblLicenceEffluent) ====\nRem Settings C39:C41 | Limits C45:H64 | Coordinates C69:F88 | Sources C92:D97\nPrivate Sub Eff_Clear(sh As Worksheet)\n    If sh.Name <> \"Licence Form\" Then Exit Sub\n    sh.Range(\"C39:D41\").ClearContents\n    sh.Range(\"C45:H64\").ClearContents\n    sh.Range(\"C69:F88\").ClearContents\n    sh.Range(\"C92:F97\").ClearContents\nEnd Sub\n\nPrivate Function Eff_OK(sh As Worksheet) As Boolean\n    Dim r As Long, bad As String\n    Eff_OK = True\n    If sh.Name <> \"Licence Form\" Then Exit Function\n    For r = 45 To 64\n        If Trim$(CStr(sh.Cells(r, 3).Value)) = \"\" And Application.WorksheetFunction.CountA(sh.Range(\"D\" & r & \":H\" & r)) > 0 Then bad = bad & \" \" & (r - 44)\n    Next r\n    If bad <> \"\" Then\n        MsgBox \"Discharge limit line(s)\" & bad & \" have details but no Parameter.\" & vbCrLf & \"Type the parameter or clear the line, then try again.\", vbExclamation, \"CMU Database\"\n        Eff_OK = False: Exit Function\n    End If\n    For r = 92 To 97\n        If Trim$(CStr(sh.Cells(r, 3).Value)) = \"\" And Trim$(CStr(sh.Cells(r, 4).Value)) <> \"\" Then bad = bad & \" \" & (r - 91)\n    Next r\n    If bad <> \"\" Then\n        MsgBox \"Discharge source line(s)\" & bad & \" have a receiving unit but no discharge source.\", vbExclamation, \"CMU Database\"\n        Eff_OK = False\n    End If\nEnd Function\n\nPrivate Sub Eff_Delete(ByVal licID As String)\n    Dim lo As ListObject, i As Long, c As Long\n    Set lo = GetLO(\"tblLicenceEffluent\")\n    licID = UCase$(Trim$(licID))\n    For i = lo.ListRows.Count To 1 Step -1\n        If UCase$(Trim$(CStr(lo.DataBodyRange.Cells(i, 1).Value))) = licID Then\n            If lo.ListRows.Count = 1 Then\n                lo.DataBodyRange.Cells(1, 1).ClearContents\n                For c = 4 To 11\n                    lo.DataBodyRange.Cells(1, c).ClearContents\n                Next c\n            Else\n                lo.ListRows(i).Delete\n            End If\n        End If\n    Next i\nEnd Sub\n\nPrivate Sub Eff_AddRow(lo As ListObject, ByVal licID As String, ByVal sect As String, ByVal ln As Long, vals As Variant)\n    Dim idx As Long, k As Long, fB As String, fC As String, fK As String\n    fB = \"=IF([@[Licence Record ID]]=\"\"\"\",\"\"\"\",IFERROR(INDEX(tblLicences[Licence / Certificate No.],MATCH([@[Licence Record ID]],tblLicences[Record ID],0))&\"\"\"\",\"\"Unknown ID\"\"))\"\n    fC = \"=IF([@[Licence Record ID]]=\"\"\"\",\"\"\"\",IFERROR(INDEX(tblLicences[Company Name],MATCH([@[Licence Record ID]],tblLicences[Record ID],0)),\"\"Unknown ID\"\"))\"\n    fK = \"=IF([@[Licence Record ID]]=\"\"\"\",\"\"\"\",UPPER(TRIM([@[Licence Record ID]]))&\"\"|\"\"&[@Section]&\"\"|\"\"&[@Line])\"\n    If lo.ListRows.Count = 1 Then\n        If CStr(lo.DataBodyRange.Cells(1, 1).Value) = \"\" And CStr(lo.DataBodyRange.Cells(1, 4).Value) = \"\" Then idx = 1\n    End If\n    If idx = 0 Then idx = lo.ListRows.Add(AlwaysInsert:=True).Index\n    lo.DataBodyRange.Cells(idx, 1).Value = licID\n    lo.DataBodyRange.Cells(idx, 2).Formula = fB\n    lo.DataBodyRange.Cells(idx, 3).Formula = fC\n    lo.DataBodyRange.Cells(idx, 4).Value = sect\n    lo.DataBodyRange.Cells(idx, 5).Value = ln\n    For k = 0 To 5\n        With lo.DataBodyRange.Cells(idx, 6 + k)\n            .NumberFormat = \"@\"\n            If k <= UBound(vals) Then\n                If Trim$(CStr(vals(k))) = \"\" Then .ClearContents Else .Value = Trim$(CStr(vals(k)))\n            Else\n                .ClearContents\n            End If\n        End With\n    Next k\n    lo.DataBodyRange.Cells(idx, 12).Formula = fK\nEnd Sub\n\nPrivate Sub Eff_Save(sh As Worksheet, ByVal licID As String)\n    Dim lo As ListObject, r As Long, n As Long\n    If sh.Name <> \"Licence Form\" Then Exit Sub\n    licID = UCase$(Trim$(licID))\n    If licID = \"\" Then Exit Sub\n    Set lo = GetLO(\"tblLicenceEffluent\")\n    Eff_Delete licID\n    For r = 39 To 41\n        If Trim$(CStr(sh.Cells(r, 3).Value)) <> \"\" Then Eff_AddRow lo, licID, \"Setting\", r - 38, Array(sh.Cells(r, 2).Value, sh.Cells(r, 3).Value)\n    Next r\n    n = 0\n    For r = 45 To 64\n        If Trim$(CStr(sh.Cells(r, 3).Value)) <> \"\" Then\n            n = n + 1\n            Eff_AddRow lo, licID, \"Limit\", n, Array(sh.Cells(r, 3).Value, sh.Cells(r, 4).Value, sh.Cells(r, 5).Value, sh.Cells(r, 6).Value, sh.Cells(r, 7).Value, sh.Cells(r, 8).Value)\n        End If\n    Next r\n    n = 0\n    For r = 69 To 88\n        If Application.WorksheetFunction.CountA(sh.Range(\"C\" & r & \":F\" & r)) > 0 Then\n            n = n + 1\n            Eff_AddRow lo, licID, \"Coordinate\", n, Array(sh.Cells(r, 3).Value, sh.Cells(r, 4).Value, sh.Cells(r, 5).Value, sh.Cells(r, 6).Value)\n        End If\n    Next r\n    n = 0\n    For r = 92 To 97\n        If Trim$(CStr(sh.Cells(r, 3).Value)) <> \"\" Then\n            n = n + 1\n            Eff_AddRow lo, licID, \"Source\", n, Array(sh.Cells(r, 3).Value, sh.Cells(r, 4).Value, sh.Cells(r, 5).Value, sh.Cells(r, 6).Value)\n        End If\n    Next r\nEnd Sub\n\nPrivate Sub Eff_Load(sh As Worksheet, ByVal licID As String)\n    Dim lo As ListObject, i As Long, k As Long, ln As Long, sect As String, more As Long\n    If sh.Name <> \"Licence Form\" Then Exit Sub\n    Eff_Clear sh\n    licID = UCase$(Trim$(licID))\n    Set lo = GetLO(\"tblLicenceEffluent\")\n    For i = 1 To lo.ListRows.Count\n        If UCase$(Trim$(CStr(lo.DataBodyRange.Cells(i, 1).Value))) = licID Then\n            sect = CStr(lo.DataBodyRange.Cells(i, 4).Value)\n            ln = Val(CStr(lo.DataBodyRange.Cells(i, 5).Value))\n            Select Case sect\n                Case \"Setting\"\n                    If ln >= 1 And ln <= 3 Then sh.Cells(38 + ln, 3).Value = lo.DataBodyRange.Cells(i, 7).Value\n                Case \"Limit\"\n                    If ln >= 1 And ln <= 20 Then\n                        For k = 0 To 5: sh.Cells(44 + ln, 3 + k).Value = lo.DataBodyRange.Cells(i, 6 + k).Value: Next k\n                    Else\n                        more = more + 1\n                    End If\n                Case \"Coordinate\"\n                    If ln >= 1 And ln <= 20 Then\n                        For k = 0 To 3: sh.Cells(68 + ln, 3 + k).Value = lo.DataBodyRange.Cells(i, 6 + k).Value: Next k\n                    Else\n                        more = more + 1\n                    End If\n                Case \"Source\"\n                    If ln >= 1 And ln <= 6 Then\n                        For k = 0 To 3: sh.Cells(91 + ln, 3 + k).Value = lo.DataBodyRange.Cells(i, 6 + k).Value: Next k\n                    Else\n                        more = more + 1\n                    End If\n            End Select\n        End If\n    Next i\n    If more > 0 Then MsgBox licID & \" has \" & more & \" effluent line(s) that do not fit on the form.\" & vbCrLf & \"See the Licence Effluent sheet.\", vbInformation, \"CMU Database\"\nEnd Sub\nRem ==== END LICENCE EFFLUENT DETAILS ====\n";
</script>
<script>
/* ===== jslib/cmu.js ===== */
/* CMU shared library — sheet definitions, computed columns, formatting, helpers.
 * Runs in the browser (window.CMU) and under Node (module.exports) so the
 * server and the client always agree on how derived values are calculated. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.CMU = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /* ------------------------------------------------------------------ date utils */
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtDate(v) {
    if (v == null || v === "") return "";
    const d = new Date(v + (String(v).length === 10 ? "T00:00:00" : ""));
    if (isNaN(d)) return String(v);
    return `${String(d.getDate()).padStart(2, "0")}-${MONTHS[d.getMonth()]}-${d.getFullYear()}`;
  }
  function fmtLongDate(v) {
    if (v == null || v === "") return "";
    const d = new Date(v + (String(v).length === 10 ? "T00:00:00" : ""));
    if (isNaN(d)) return String(v);
    return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  }
  function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

  /* ------------------------------------------------------------------ number utils */
  function fmtNum(v, dec) {
    if (v == null || v === "" || isNaN(+v)) return "";
    const n = +v;
    if (dec != null) return n.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return Math.abs(n - Math.round(n)) < 1e-9 ? Math.round(n).toLocaleString("en-US") : n.toLocaleString("en-US", { maximumFractionDigits: 3 });
  }
  function fmtMoney(v) {
    if (v == null || v === "" || isNaN(+v)) return "";
    return "$" + (+v).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }

  const ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  const TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
  function chunkWords(n) {
    let s = "";
    if (n >= 100) { s += ONES[Math.floor(n / 100)] + " hundred"; n %= 100; if (n) s += " "; }
    if (n >= 20) { s += TENS[Math.floor(n / 10)]; if (n % 10) s += "-" + ONES[n % 10]; }
    else if (n > 0) s += ONES[n];
    return s;
  }
  function intWords(num) {
    let n = Math.floor(Math.abs(num));
    if (n === 0) return "zero";
    const groups = [[1e9, "billion"], [1e6, "million"], [1e3, "thousand"]];
    let parts = [];
    for (const [div, name] of groups) {
      if (n >= div) { parts.push(chunkWords(Math.floor(n / div)), name); n %= div; }
    }
    if (n > 0) parts.push(chunkWords(n));
    return parts.join(" ").replace(/\s+/g, " ").trim();
  }
  function amountWords(v) {
    if (v == null || v === "" || isNaN(+v)) return "";
    const n = +v;
    const dollars = Math.floor(n);
    const cents = Math.round((n - dollars) * 100);
    const centsTxt = cents ? ` and ${intWords(cents)} cents` : "";
    return `UNITED STATES DOLLARS-${intWords(dollars).toUpperCase()}${centsTxt.toUpperCase()} (US$${n.toFixed(2)})`;
  }

  /* ------------------------------------------------------------------ computations */
  const KG_PER_UNIT = { kg: 1, mt: 1000, l: 1, litre: 1, liters: 1, ltr: 1, pcs: null, "": 1 };

  function qtyKg(qty, unit) {
    if (qty == null || qty === "" || isNaN(+qty)) return null;
    const u = String(unit || "kg").toLowerCase().trim();
    const f = KG_PER_UNIT[u];
    if (f == null) return null; // Unverified units
    if (u === "" ) return +qty;
    return +qty * f;
  }
  function licenceStatus(licenceNo, expiryDate, ref) {
    if (!licenceNo) return "Pending – no licence no.";
    if (!expiryDate) return "Issued – expiry not recorded";
    const t = today();
    return expiryDate >= t ? "Active" : "Expired";
  }

  function index(data, sheetKey, col) {
    const m = new Map();
    (data.sheets[sheetKey].rows || []).forEach((r) => { const k = r[col]; if (k != null) m.set(String(k), r); });
    return m;
  }

  /* Build lookup maps once per dataset; passed around for fast joins. */
  function buildIndexes(data) {
    const ix = {};
    ix.companyById = index(data, "companies", 0);
    ix.licenceById = index(data, "licences", 0);
    ix.billByNo = new Map();
    (data.sheets.bills.rows || []).forEach((r) => { if (r[1]) ix.billByNo.set(String(r[1]), r); });
    ix.clearanceByNo = new Map();
    (data.sheets.clearances.rows || []).forEach((r) => { if (r[1]) ix.clearanceByNo.set(String(r[1]), r); });
    return ix;
  }

  function companyStats(data, companyId, ixIn) {
    const ix = ixIn || buildIndexes(data);
    let licences = 0, clearances = 0, kg = 0, billed = 0, paid = 0;
    data.sheets.licences.rows.forEach((r) => { if (r[1] === companyId) licences++; });
    data.sheets.clearances.rows.forEach((r) => {
      if (r[2] === companyId) { clearances++; const k = qtyKg(r[6], r[7]); if (k != null) kg += k; }
    });
    data.sheets.bills.rows.forEach((r) => { if (r[2] === companyId && !isNaN(+r[9])) billed += +r[9]; });
    data.sheets.payments.rows.forEach((r) => { if (r[1] === companyId && !isNaN(+r[5])) paid += +r[5]; });
    return { licences, clearances, kg, billed, paid };
  }

  function billRollups(data) {
    const byCompanyBilled = {}, byCompanyPaid = {}, byBillPaid = {}, billAmount = {}, billLines = {};
    data.sheets.bills.rows.forEach((r) => {
      const co = r[2]; if (!co) return;
      byCompanyBilled[co] = (byCompanyBilled[co] || 0) + (+r[9] || 0);
      if (!billLines[r[1]]) billLines[r[1]] = { total: 0, first: r };
      billLines[r[1]].total += (+r[9] || 0);
    });
    data.sheets.payments.rows.forEach((r) => {
      const co = r[1]; if (!co) return;
      byCompanyPaid[co] = (byCompanyPaid[co] || 0) + (+r[5] || 0);
      if (r[11]) byBillPaid[String(r[11])] = (byBillPaid[String(r[11])] || 0) + (+r[5] || 0);
    });
    return { byCompanyBilled, byCompanyPaid, byBillPaid, billLines };
  }

  /* Compute the value of a calculated cell for sheet/rowIdx/colIdx. */
  function calcCell(data, sheetKey, rowIdx, colIdx, ix) {
    const row = data.sheets[sheetKey].rows[rowIdx];
    if (!row) return null;
    const def = S[sheetKey].columns[colIdx];
    if (!def || !def.calc) return null;
    ix = ix || buildIndexes(data);
    switch (def.calc) {
      case "licenceStatus": return licenceStatus(row[10], row[12]);
      case "qtyKg": return qtyKg(row[6], row[7]);
      case "qtyMt": { const k = qtyKg(row[6], row[7]); return k == null ? null : +(k / 1000).toFixed(4); }
      case "companyLicences": case "companyClearances": case "companyKg": case "companyBilled": case "companyPaid": {
        let companyId;
        if (sheetKey === "companies") companyId = row[0];
        else companyId = row[2];
        if (sheetKey === "bills" && (def.calc === "companyBilled" || def.calc === "companyPaid")) {
          const ru = billRollups(data);
          return def.calc === "companyBilled" ? ru.byCompanyBilled[companyId] || 0 : ru.byCompanyPaid[companyId] || 0;
        }
        const st = companyStats(data, companyId, ix);
        return def.calc === "companyLicences" ? st.licences : def.calc === "companyClearances" ? st.clearances :
          def.calc === "companyKg" ? +st.kg.toFixed(2) : def.calc === "companyBilled" ? st.billed : st.paid;
      }
      case "paymentStatus": {
        const ru = billRollups(data);
        const co = row[2], b = ru.byCompanyBilled[co] || 0, p = ru.byCompanyPaid[co] || 0;
        if (!b) return "No payment on record";
        if (p <= 0) return "No payment on record";
        return p + 0.005 >= b ? "Paid" : "Part paid";
      }
      case "paidOnBill": {
        const ru = billRollups(data);
        return ru.byBillPaid[String(row[1])] || 0;
      }
      case "billStatus": {
        const ru = billRollups(data);
        const co = row[2], b = ru.byCompanyBilled[co] || 0, p = ru.byCompanyPaid[co] || 0;
        if (p > 0 && p + 0.005 >= b) return "Paid (company account)";
        if (p > 0) return "Part paid (company account)";
        return "Unpaid";
      }
      default: return null;
    }
  }

  /* The displayed value for a cell: stored value, joined value, or computed value. */
  function displayValue(data, sheetKey, rowIdx, colIdx, ix) {
    const row = data.sheets[sheetKey].rows[rowIdx];
    if (!row) return null;
    const def = S[sheetKey].columns[colIdx];
    if (!def) return row[colIdx];
    if (def.calc) return calcCell(data, sheetKey, rowIdx, colIdx, ix);
    if (def.calcJoin) return joinValue(data, sheetKey, row, colIdx);
    return row[colIdx];
  }

  function joinValue(data, sheetKey, row, colIdx) {
    const def = S[sheetKey].columns[colIdx];
    if (!def || !def.calcJoin) return row ? row[colIdx] : null;
    const idVal = row[def.calcJoin.keyCol != null ? def.calcJoin.keyCol : 0];
    if (idVal != null) {
      for (const r of data.sheets[def.calcJoin.sheet].rows) {
        if (String(r[def.calcJoin.match]) === String(idVal)) {
          const v = r[def.calcJoin.from];
          if (v != null && v !== "") return v;
        }
      }
    }
    const fb = def.calcJoin.fallbackCol != null ? row[def.calcJoin.fallbackCol] : null;
    return fb != null ? fb : null;
  }

  /* Next sequential ids, e.g. CMU-071, LIC-071, CLN-148, BN-2026-021 */
  function nextId(data, sheetKey) {
    const sh = data.sheets[sheetKey];
    const def = S[sheetKey];
    if (!def || !def.idPrefix || def.idCol == null) return null;
    const re = new RegExp("^" + def.idPrefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\d+)");
    let max = 0;
    (sh.rows || []).forEach((r) => {
      const v = r[def.idCol];
      if (typeof v === "string") { const m = re.exec(v); if (m) max = Math.max(max, parseInt(m[1], 10)); }
    });
    return def.idPrefix + String(max + 1).padStart(3, "0");
  }
  function nextGroupId(data, sheetKey) {
    const sh = data.sheets[sheetKey];
    const def = S[sheetKey];
    if (!def || !def.groupPrefix || def.groupById == null) return null;
    const re = new RegExp("^" + def.groupPrefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\d+)");
    let max = 0;
    (sh.rows || []).forEach((r) => {
      const v = r[def.groupById];
      if (typeof v === "string") { const m = re.exec(v); if (m) max = Math.max(max, parseInt(m[1], 10)); }
    });
    return def.groupPrefix + String(max + 1).padStart(3, "0");
  }
  function nextBillNo(data) {
    const year = new Date().getFullYear();
    const re = /^BN-(\d{4})-(\d+)$/;
    let max = 0;
    data.sheets.bills.rows.forEach((r) => { const m = re.exec(String(r[1] || "")); if (m && +m[1] === year) max = Math.max(max, +m[2]); });
    return `BN-${year}-${String(max + 1).padStart(3, "0")}`;
  }

  function statusClass(v) {
    if (!v) return "";
    const s = String(v).toLowerCase();
    if (s === "active" || s === "paid" || s === "closed") return "st-green";
    if (s.startsWith("pending") || s.startsWith("part paid") || s.startsWith("open") || s.startsWith("issued")) return "st-amber";
    if (s === "expired" || s === "unpaid" || s.includes("no payment")) return "st-red";
    return "st-gray";
  }

  /* Dashboard aggregates */
  function dashboard(data) {
    const ix = buildIndexes(data);
    const companies = data.sheets.companies.rows.length;
    const licences = data.sheets.licences.rows;
    let numbered = 0, pending = 0, active = 0, issuedNoExpiry = 0, expired = 0;
    const byCat = {};
    licences.forEach((r) => {
      const st = licenceStatus(r[10], r[12]);
      if (st === "Pending – no licence no.") pending++; else numbered++;
      if (st === "Active") active++; else if (st === "Issued – expiry not recorded") issuedNoExpiry++; else if (st === "Expired") expired++;
      const cat = r[4] || "(no category)";
      byCat[cat] = byCat[cat] || { total: 0, active: 0, issued: 0, pending: 0, expired: 0 };
      byCat[cat].total++;
      if (st === "Active") byCat[cat].active++;
      else if (st === "Pending – no licence no.") byCat[cat].pending++;
      else if (st === "Expired") byCat[cat].expired++;
      else byCat[cat].issued++;
    });
    let clearanceLines = 0, totalKg = 0;
    const byChemical = {};
    const monthly = {};
    for (let m = 1; m <= 12; m++) monthly[m] = { clearances: 0, kg: 0, payments: 0, paid: 0, billed: 0, licencesIssued: 0 };
    let noDateClearances = 0, noDateKg = 0, noDatePayments = 0, noDatePaid = 0, noDateBilled = 0, noDateLicences = 0;
    data.sheets.clearances.rows.forEach((r) => {
      clearanceLines++;
      const k = qtyKg(r[6], r[7]);
      if (k != null) totalKg += k;
      const std = r[5] || r[4] || "Other / Unspecified";
      byChemical[std] = byChemical[std] || { shipments: 0, kg: 0 };
      byChemical[std].shipments++;
      if (k != null) byChemical[std].kg += k;
      const d = r[12];
      if (d && /^\d{4}-\d{2}/.test(String(d))) {
        const m = +String(d).slice(5, 7);
        monthly[m].clearances++; if (k != null) monthly[m].kg += k;
      } else { noDateClearances++; if (k != null) noDateKg += k; }
    });
    data.sheets.payments.rows.forEach((r) => {
      const d = r[6], amt = +r[5] || 0;
      if (d && /^\d{4}-\d{2}/.test(String(d))) { const m = +String(d).slice(5, 7); monthly[m].payments++; monthly[m].paid += amt; }
      else { noDatePayments++; noDatePaid += amt; }
    });
    data.sheets.bills.rows.forEach((r) => {
      const d = r[10], amt = +r[9] || 0;
      if (d && /^\d{4}-\d{2}/.test(String(d))) { const m = +String(d).slice(5, 7); monthly[m].billed += amt; }
      else noDateBilled += amt;
    });
    licences.forEach((r) => {
      const d = r[11];
      if (d && /^\d{4}-\d{2}/.test(String(d))) { const m = +String(d).slice(5, 7); monthly[m].licencesIssued++; }
      else if (r[10]) noDateLicences++;
    });
    const ru = billRollups(data);
    let totalBilled = 0, totalPaid = 0, openIssues = 0;
    data.sheets.bills.rows.forEach((r) => totalBilled += +r[9] || 0);
    data.sheets.payments.rows.forEach((r) => totalPaid += +r[5] || 0);
    data.sheets.issues.rows.forEach((r) => { if (String(r[6] || "").toLowerCase().startsWith("open")) openIssues++; });

    const billGroups = {};
    Object.keys(ru.billLines).forEach((bn) => {
      const g = ru.billLines[bn];
      const first = g.first;
      const co = first[2];
      const billed = g.total;
      const paidCo = ru.byCompanyPaid[co] || 0;
      const paidBill = ru.byBillPaid[bn] || 0;
      let status;
      if (paidBill > 0) status = paidBill + 0.005 >= billed ? "Paid" : "Part paid";
      else status = paidCo > 0 ? (paidCo + 0.005 >= (ru.byCompanyBilled[co] || 0) ? "Paid (company account)" : "Part paid (company account)") : "Unpaid";
      billGroups[bn] = { billNo: bn, company: first[3], billDate: first[10], billed, paid: paidBill || Math.min(paidCo, billed), status, billType: first[18] };
    });
    const outstanding = Object.values(billGroups)
      .filter((b) => b.status !== "Paid" && b.status !== "Paid (company account)")
      .sort((a, b) => (a.billDate < b.billDate ? -1 : 1));
    const paymentStatus = { paid: 0, paidAmt: 0, part: 0, partAmt: 0, none: 0, noneAmt: 0 };
    Object.values(billGroups).forEach((b) => {
      if (b.status.startsWith("Paid")) { paymentStatus.paid++; paymentStatus.paidAmt += b.billed; }
      else if (b.status.startsWith("Part paid")) { paymentStatus.part++; paymentStatus.partAmt += b.billed; }
      else { paymentStatus.none++; paymentStatus.noneAmt += b.billed; }
    });
    const chemicals = Object.entries(byChemical).map(([name, v]) => ({ name, shipments: v.shipments, kg: v.kg, mt: v.kg / 1000 }))
      .sort((a, b) => b.kg - a.kg);

    return {
      companies, licencesNumbered: numbered, licencesPending: pending, active, issuedNoExpiry, expired,
      clearanceLines, totalKg, totalMt: totalKg / 1000, totalBilled, totalPaid, openIssues,
      byCategory: byCat, monthly, noDate: { clearances: noDateClearances, kg: noDateKg, payments: noDatePayments, paid: noDatePaid, billed: noDateBilled, licences: noDateLicences },
      chemicals, billGroups, outstanding, paymentStatus,
    };
  }

  /* System check – health of the data */
  function systemCheck(data) {
    const checks = [];
    const push = (area, ok, detail) => checks.push({ area, ok, detail });
    const sheetOk = (k) => data.sheets[k] && Array.isArray(data.sheets[k].rows);
    ["companies", "licences", "licenceChemicals", "licenceVehicles", "licenceEffluent", "clearances", "bills", "payments", "issues", "correspondence", "srcBmmc", "srcReceipts"].forEach((k) =>
      push("Registers", sheetOk(k), `${S[k] ? S[k].name : k}: ${sheetOk(k) ? data.sheets[k].rows.length + " rows" : "missing"}`));

    const ids = (sheetKey, col) => data.sheets[sheetKey].rows.map((r) => r[col]).filter(Boolean);
    const dup = (arr) => { const seen = {}; const d = {}; arr.forEach((v) => { seen[v] = (seen[v] || 0) + 1; if (seen[v] === 2) d[v] = true; }); return Object.keys(d); };

    const companyIds = ids("companies", 0);
    push("Record IDs", dup(companyIds).length === 0, dup(companyIds).length ? "Duplicate Company IDs: " + dup(companyIds).join(", ") : `${companyIds.length} company IDs, all unique`);
    const licIds = ids("licences", 0);
    push("Record IDs", dup(licIds).length === 0, dup(licIds).length ? "Duplicate Licence IDs: " + dup(licIds).join(", ") : `${licIds.length} licence IDs, all unique`);
    const dupLicNos = dup(ids("licences", 10).filter(Boolean));
    push("Record IDs", dupLicNos.length === 0, dupLicNos.length ? "Same licence no. used by more than one record: " + dupLicNos.slice(0, 6).join(", ") + (dupLicNos.length > 6 ? "…" : "") + " (see remarks on those rows)" : "Licence numbers unique per record");

    const companySet = new Set(companyIds.map(String));
    const orphans = [];
    data.sheets.licences.rows.forEach((r) => { if (r[1] && !companySet.has(String(r[1]))) orphans.push(`${r[0]}→${r[1]}`); });
    data.sheets.bills.rows.forEach((r) => { if (r[2] && !companySet.has(String(r[2]))) orphans.push(`${r[0]}→${r[2]}`); });
    push("Links", orphans.length === 0, orphans.length ? "Records pointing at a Company ID that does not exist: " + orphans.slice(0, 8).join(", ") : "Every licence/bill links to an existing company");

    const billNos = new Set(ids("bills", 1).map(String));
    const payOrphans = data.sheets.payments.rows.filter((r) => r[11] && !billNos.has(String(r[11]))).map((r) => r[0]);
    push("Links", payOrphans.length === 0, payOrphans.length ? "Payments linked to a Bill No. that does not exist: " + payOrphans.join(", ") : "All payment→bill links valid");

    const receipts = {};
    let dupReceipts = 0;
    data.sheets.payments.rows.forEach((r) => { if (r[7]) { receipts[r[7]] = (receipts[r[7]] || 0) + 1; } });
    Object.values(receipts).forEach((n) => { if (n > 1) dupReceipts++; });
    push("Data quality", dupReceipts === 0, dupReceipts ? `${dupReceipts} receipt number(s) used more than once` : "Receipt numbers unique");

    let badQty = data.sheets.clearances.rows.filter((r) => qtyKg(r[6], r[7]) == null && r[6] != null).length;
    push("Data quality", badQty === 0, badQty ? `${badQty} clearance line(s) with a unit that cannot be converted to kg (e.g. Unverified)` : "All clearance quantities convertible to kg");

    const openIssues = data.sheets.issues.rows.filter((r) => String(r[6] || "").toLowerCase().startsWith("open")).length;
    push("Notes & Issues", openIssues === 0, openIssues ? `${openIssues} open data issue(s) – review them on the Notes & Issues register` : "No open data issues");

    const listsOk = data.lists && data.lists.licenceCategory && data.lists.licenceCategory.length > 0;
    push("Settings", listsOk, "Dropdown lists, fee schedule and print settings loaded");
    push("Settings", (data.fees.billTypes || []).length > 0, `${(data.fees.services || []).length} services · ${(data.fees.billTypes || []).length} bill types with letter wording`);
    return checks;
  }

  return {
    SHEETS: S, MONTHS, fmtDate, fmtLongDate, today, fmtNum, fmtMoney, amountWords, intWords,
    qtyKg, licenceStatus, buildIndexes, companyStats, billRollups, calcCell, displayValue, joinValue,
    nextId, nextGroupId, nextBillNo, statusClass, dashboard, systemCheck,
  };
});

  <script>
/* ===== js/store.js ===== */
/* Store — client data layer: loads the dataset, applies edits optimistically,
 * talks to the API, keeps an undo stack and a tiny event bus. */
(function () {
  "use strict";

  const listeners = {};
  const state = {
    data: null,          // full dataset (sheets, lists, fees, printSettings, settings, nextIds)
    user: null,          // {username, fullName, role} or null (demo mode)
    token: localStorage.getItem("cmu-token") || "",
    undoStack: [],       // arrays of inverse ops
    redoStack: [],
    prefs: JSON.parse(localStorage.getItem("cmu-prefs") || "{}"),
  };

  function emit(ev, arg) { (listeners[ev] || []).forEach((cb) => { try { cb(arg); } catch (e) { console.error(e); } }); }
  function on(ev, cb) { (listeners[ev] = listeners[ev] || []).push(cb); }

  function savePrefs() { localStorage.setItem("cmu-prefs", JSON.stringify(state.prefs)); }

  async function api(method, url, body) {
    const headers = { "Content-Type": "application/json" };
    if (state.token) headers["X-CMU-Token"] = state.token;
    const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
    let json = null;
    try { json = await res.json(); } catch (e) { /* non-json */ }
    if (!res.ok) {
      const err = new Error((json && json.error) || res.statusText || "Request failed");
      err.status = res.status;
      throw err;
    }
    return json;
  }

  async function refresh() {
    state.data = await api("GET", "/api/data");
    emit("data", state.data);
    return state.data;
  }

  async function init() {
    if (state.token) {
      try {
        const me = await api("GET", "/api/me");
        state.user = me.user;
      } catch (e) { state.token = ""; state.user = null; localStorage.removeItem("cmu-token"); }
    }
    await refresh();
    return state.data;
  }

  /* ---------------- grid ops (optimistic) ---------------- */
  function applyOpsLocally(ops) {
    for (const op of ops) {
      const sheet = state.data.sheets[op.sheet];
      if (!sheet) continue;
      if (op.op === "setCell") {
        const row = sheet.rows[op.row];
        if (!row) continue;
        while (row.length < op.col + 1) row.push(null);
        row[op.col] = op.value;
      } else if (op.op === "insertRow") {
        sheet.rows.splice(op.at, 0, op.values || []);
      } else if (op.op === "deleteRow") {
        sheet.rows.splice(op.row, 1);
      }
    }
  }

  function invertOps(applied) {
    // applied ops come back from the server in inverse form already
    return applied.map((a) => {
      if (a.op === "setCell") return { op: "setCell", sheet: a.sheet, row: a.row, col: a.col, value: a.from };
      if (a.op === "insertRow") return { op: "insertRow", sheet: a.sheet, at: a.at, values: a.values };
      if (a.op === "deleteRow") return { op: "deleteRow", sheet: a.sheet, row: a.at };
      return a;
    });
  }

  async function submitOps(ops, { undoable = true } = {}) {
    if (!ops || !ops.length) return;
    // capture the inverse BEFORE applying, so undo restores previous values
    const inverse = [];
    for (const op of [...ops].reverse()) {
      const sheet = state.data.sheets[op.sheet];
      if (!sheet) continue;
      if (op.op === "setCell") {
        const row = sheet.rows[op.row];
        inverse.push({ op: "setCell", sheet: op.sheet, row: op.row, col: op.col, value: row ? row[op.col] : null });
      } else if (op.op === "insertRow") {
        inverse.push({ op: "deleteRow", sheet: op.sheet, row: op.at });
      } else if (op.op === "deleteRow") {
        inverse.push({ op: "insertRow", sheet: op.sheet, at: op.row, values: sheet.rows[op.row] || [] });
      }
    }
    // optimistic local apply (ops are forward ops)
    applyOpsLocally(ops);
    emit("data", state.data);
    emit("saving");
    try {
      const res = await api("POST", "/api/ops", { ops });
      if (res.nextIds) state.data.nextIds = res.nextIds;
      if (undoable) {
        state.undoStack.push({ forward: ops, inverse });
        if (state.undoStack.length > 100) state.undoStack.shift();
        state.redoStack = [];
      }
      emit("saved");
    } catch (e) {
      await refresh(); // roll back to server truth
      emit("saved");
      throw e;
    }
  }

  async function undo() {
    const entry = state.undoStack.pop();
    if (!entry) return;
    await submitOps(entry.inverse, { undoable: false });
    state.redoStack.push(entry);
  }

  async function redo() {
    const entry = state.redoStack.pop();
    if (!entry) return;
    await submitOps(entry.forward, { undoable: false });
    state.undoStack.push(entry);
  }

  /* ---------------- record forms / settings ---------------- */
  async function record(kind, body) {
    emit("saving");
    try {
      const res = await api("POST", "/api/record/" + kind, body);
      await refresh();
      emit("saved");
      return res; // {ok, id/billNo/clearanceNo, warnings, nextIds}
    } catch (e) { emit("saved"); throw e; }
  }

  async function saveLists(payload) {
    emit("saving");
    try { await api("POST", "/api/settings/lists", payload); await refresh(); emit("saved"); }
    catch (e) { emit("saved"); throw e; }
  }
  async function saveFees(payload) {
    emit("saving");
    try { await api("POST", "/api/settings/fees", payload); await refresh(); emit("saved"); }
    catch (e) { emit("saved"); throw e; }
  }

  /* ---------------- auth ---------------- */
  async function login(username, password) {
    const res = await api("POST", "/api/login", { username, password });
    state.token = res.token; state.user = res.user;
    localStorage.setItem("cmu-token", res.token);
    emit("user", res.user);
    return res;
  }
  async function logout() {
    try { await api("POST", "/api/logout", {}); } catch (e) {}
    state.token = ""; state.user = null;
    localStorage.removeItem("cmu-token");
    emit("user", null);
  }
  async function changePassword(oldPassword, newPassword) {
    return api("POST", "/api/password", { oldPassword, newPassword });
  }
  async function users() { return api("GET", "/api/users"); }
  async function saveUser(payload) { return api("POST", "/api/users/save", payload); }
  async function setLoginRequired(v) { return api("POST", "/api/settings/mode", { loginRequired: v }); }
  async function auditLog() { return api("GET", "/api/audit"); }
  async function resetData() { await api("POST", "/api/reset", {}); await refresh(); }

  window.Store = {
    state, on, init, refresh, api,
    submitOps, undo, redo,
    record, saveLists, saveFees,
    login, logout, changePassword, users, saveUser, setLoginRequired, auditLog, resetData,
    prefs: {
      get: (k, d) => (k in state.prefs ? state.prefs[k] : d),
      set: (k, v) => { state.prefs[k] = v; savePrefs(); },
    },
  };

  /* ---------------- tiny helpers used everywhere ---------------- */
  let toastRoot;
  function toast(msg, kind) {
    toastRoot = toastRoot || document.getElementById("toastRoot");
    if (!toastRoot) return;
    const el = document.createElement("div");
    el.className = "toast " + (kind || "");
    el.innerHTML = msg;
    toastRoot.appendChild(el);
    setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 320); }, kind === "bad" ? 6000 : 3200);
  }
  window.toast = toast;

  window.esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  };
})();
